<script>
async function sha256(message) {
  const msgBuffer = new TextEncoder().encode(message);
  const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
  const hashArray = Array.from(new Uint8Array(hashBuffer));
  return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
}

function getSecText(vaultKey, decryptKey) {
  if (!secureVault[vaultKey] || !secureVault[vaultKey][currentLang]) return "";
  const hex = secureVault[vaultKey][currentLang];
  return xor(hexToTxt(hex), decryptKey);
}

function runBootSequence() {
  const container = document.getElementById('boot-screen');
  let lineIdx = 0;
  function addLine() {
    if (lineIdx < bootLines.length) {
      container.innerHTML += bootLines[lineIdx] + "\n";
      lineIdx++;
      setTimeout(addLine, Math.random() * 200 + 80);
    } else {
      setTimeout(() => {
        container.style.display = 'none';
        document.getElementById('main-screen').style.display = 'flex';
        updateUI();
        document.getElementById('terminal-output').innerHTML = 
          getSecText("init", "KPR2027");
        document.getElementById('terminal-input').focus();
      }, 500);
    }
  }
  addLine();
}

function updateTimers() {
  const now = new Date().getTime();
  const diff = targetDate - now;
  if (diff <= 0) {
    document.getElementById('timer-container').innerText = "00:00:00:00";
    document.getElementById('secret-timer').innerText = "00:00:00:00";
    return;
  }
  const days = Math.floor(diff / (1000 * 60 * 60 * 24));
  const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
  const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
  const seconds = Math.floor((diff % (1000 * 60)) / 1000);
  const pad = (num) => String(num).padStart(2, '0');
  const timerStr = pad(days) + ":" + pad(hours) + ":" + pad(minutes) + ":" + pad(seconds);
  document.getElementById('timer-container').innerText = timerStr;
  document.getElementById('secret-timer').innerText = timerStr;
}

function showToast() {
  const toast = document.getElementById('lang-toast');
  toast.innerText = UI_DATA[currentLang].t;
  toast.classList.add('show');
  setTimeout(() => { toast.classList.remove('show'); }, 1200);
}

function toggleLang() {
  if(isLockout) return;
  currentLang = currentLang === 'RU' ? 'EN' : 'RU';
  document.getElementById('lang-toggle').innerText = 
    currentLang === 'RU' ? 'EN' : 'RU';
  updateUI();
  showToast();
  
  if (customMessageActive && currentCustomKey) {
    if (openEggs[currentCustomKey]) {
      document.getElementById('terminal-output').innerHTML = 
        openEggs[currentCustomKey][currentLang];
    } else {
      document.getElementById('terminal-output').innerHTML = 
        getSecText(currentCustomKey, currentCustomKey === "init" ? 
          "KPR2027" : currentCustomKey);
    }
  } else {
    if (currentStep === 0) {
      document.getElementById('terminal-output').innerHTML = 
        getSecText("init", "KPR2027");
    } else {
      document.getElementById('terminal-output').innerHTML = 
        lastDecryptedStepText[currentLang];
    }
  }
}

function updateUI() {
  document.getElementById('submit-btn').innerText = UI_DATA[currentLang].s;
  document.getElementById('secret-title').innerText = UI_DATA[currentLang].st;
  document.getElementById('back-btn').innerText = UI_DATA[currentLang].b;
}

function openSecret() {
  if(isLockout) return;
  document.getElementById('main-screen').style.display = 'none';
  document.getElementById('secret-screen').style.display = 'flex';
}

function closeSecret() {
  document.getElementById('secret-screen').style.display = 'none';
  document.getElementById('main-screen').style.display = 'flex';
  setTimeout(() => { document.getElementById('terminal-input').focus(); }, 50);
}
