<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>The End of Beginnings</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000 !important;
            overflow: hidden;
            box-sizing: border-box;
        }

        body {
            color: #00ff00;
            font-family: monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            transition: color 1s ease;
            padding: 15px;
            position: relative;
        }

        /* Полный экран загрузки старого ПК */
        #bootScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            color: #00ff00;
            font-family: monospace;
            font-size: 14px;
            line-height: 1.3;
            text-align: left;
            padding: 25px;
            box-sizing: border-box;
            z-index: 10000;
            overflow: hidden;
            white-space: pre-wrap;
        }

        /* Состояние успеха (Ярко-зелёная вспышка) */
        body.success-alert {
            color: #00ff00 !important;
            transition: none !important;
        }

        body.success-alert .box {
            border-color: #00ff00 !important;
            box-shadow: 0 0 35px rgba(0, 255, 0, 0.9) !important;
            background-color: rgba(0, 50, 0, 0.5) !important;
            transition: none !important;
        }

        body.success-alert #text {
            text-shadow: 0 0 15px rgba(0, 255, 0, 0.9) !important;
        }

        /* Состояние ошибки */
        body.error-alert {
            color: #ff0000 !important;
            transition: none !important;
        }

        body.error-alert .box {
            border-color: #ff0000 !important;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.5) !important;
            transition: none !important;
        }

        body.error-alert input {
            border-color: #ff0000 !important;
            color: #ff0000 !important;
            transition: none !important;
        }

        body.error-alert button.submit-btn {
            background-color: #ff0000 !important;
            transition: none !important;
        }

        body.error-alert .custom-lang-btn, 
        body.error-alert .custom-lang-dropdown,
        body.error-alert .timer-link {
            border-color: #ff0000 !important;
            color: #ff0000 !important;
            transition: none !important;
        }

        body.error-alert .custom-lang-option:hover {
            background: rgba(255, 0, 0, 0.2) !important;
        }

        .box {
            border: 2px solid #00ff00;
            padding: 35px 25px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            border-radius: 10px;
            background-color: #050505;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.3);
            transition: all 1s ease; 
            max-width: 500px;
            width: 100%;
            max-height: 70vh;
            box-sizing: border-box;
            overflow-y: auto;
            margin-top: 40px;
        }
        .custom-lang-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 9999;
            font-family: monospace;
            width: 160px;
            box-sizing: border-box;
        }

        .custom-lang-btn {
            background: #000;
            border: 2px solid #00ff00;
            color: #00ff00;
            padding: 10px 0;
            font-size: 16px;
            cursor: pointer;
            outline: none;
            transition: all 1s ease;
            width: 100%;
            box-sizing: border-box;
            font-weight: bold;
            text-align: center;
        }
        
        .custom-lang-dropdown {
            display: none;
            position: absolute;
            bottom: 100%;
            right: 0;
            margin-bottom: 5px;
            background: #000;
            border: 2px solid #00ff00;
            width: 100%;
            box-sizing: border-box;
            transition: all 1s ease;
        }

        .custom-lang-dropdown.active {
            display: block;
        }

        .custom-lang-option {
            padding: 10px 0;
            color: #00ff00;
            cursor: pointer;
            text-align: center;
            font-size: 16px;
            width: 100%;
            box-sizing: border-box;
        }

        .custom-lang-option:hover {
            background: rgba(0, 255, 0, 0.2);
        }

        .timer-link {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: transparent;
            border: 1px dashed #00ff00;
            color: #00ff00;
            padding: 8px 20px;
            text-decoration: none;
            font-family: monospace;
            font-size: 16px;
            cursor: pointer;
            z-index: 9999;
            transition: border 1s ease, color 1s ease, background 0.2s;
            box-sizing: border-box;
            white-space: nowrap;
        }

        .timer-link:hover {
            background: rgba(0, 255, 0, 0.1);
            border-style: solid;
        }

        .input-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 12px;
            width: 100%;
            margin-top: auto;
            box-sizing: border-box;
        }

        input {
            background: #111;
            border: 1px solid #00ff00;
            color: #00ff00;
            padding: 12px;
            font-family: monospace;
            font-size: 16px;
            outline: none;
            transition: all 1s ease;
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
            -webkit-appearance: none;
            border-radius: 0;
            text-align: center;
        }

        button.submit-btn {
            background: #00ff00;
            color: #000;
            padding: 12px;
            font-weight: bold;
            border: none;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 1s ease;
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
        }

        button.submit-btn:hover {
            background: #00cc00;
        }

        #text, #archiveText {
            font-size: 20px;
            line-height: 1.4;
            white-space: pre-line;
            text-shadow: 0 0 5px rgba(0, 255, 0, 0.5);
            animation: tv-text-jump 1.6s steps(1) infinite;
            word-wrap: break-word;
            word-break: break-word;
            overflow-wrap: break-word;
        }

        #text {
            margin-bottom: 25px;
            min-height: 60px;
            text-align: center;
        }

        #archiveText {
            text-align: left;
            font-size: 18px;
            line-height: 1.6;
        }

        body.error-alert #text {
            text-shadow: 0 0 7px rgba(255, 0, 0, 0.7);
            animation: tv-text-jump-heavy 0.6s steps(1) infinite;
        }

        @keyframes tv-text-jump {
            0% { transform: translate(0, 0); }
            5% { transform: translate(-0.5px, 0.5px); }
            8% { transform: translate(0, 0); }
            30% { transform: translate(0.5px, -0.5px); }
            33% { transform: translate(0, 0); }
            65% { transform: translate(-0.5px, -0.5px); }
            68% { transform: translate(0, 0); }
            85% { transform: translate(0.5px, 0.5px); }
            88% { transform: translate(0, 0); }
        }

        @keyframes tv-text-jump-heavy {
            0% { transform: translate(0, 0); }
            10% { transform: translate(-1.5px, 0.5px); }
            20% { transform: translate(1px, -1px); }
            30% { transform: translate(0, 0); }
            50% { transform: translate(-1px, -0.5px); }
            60% { transform: translate(1.5px, 0.5px); }
            70% { transform: translate(0, 0); }
            90% { transform: translate(-0.5px, 1px); }
        }

        @media (max-width: 600px) {
            body { align-items: center; padding: 10px; }
            .box { padding: 25px 20px; max-height: 60vh; margin-top: 60px; }
            #text, #archiveText { font-size: 15px; line-height: 1.4; }
            #text { margin-bottom: 20px; min-height: auto; }
            input, button.submit-btn { font-size: 14px; padding: 10px; max-width: 100%; }
            .timer-link { top: 15px; font-size: 13px; padding: 6px 12px; }
            .custom-lang-container { right: 10px; bottom: 10px; width: 130px; }
            .custom-lang-btn, .custom-lang-option { font-size: 14px; padding: 8px 0; }
        }
    </style>
</head>

        function toggleLangDropdown() {
            document.getElementById("langDropdown").classList.toggle("active");
        }

        function selectLanguage(langCode) {
            document.getElementById("langDropdown").classList.remove("active");
            changeLanguage(langCode);
        }
                            function updateDisplay() {
            var screen = document.getElementById("text");
            var archiveScreenText = document.getElementById("archiveText");
            var inputField = document.getElementById("userAnswer");
            var submitBtn = document.getElementById("submitBtn");
            var langBtn = document.getElementById("langBtn");

            if (submitBtn) { submitBtn.innerText = interfaceUi[currentLang].btn; }
            if (inputField) { inputField.placeholder = interfaceUi[currentLang].placeholder; }
            if (langBtn) { langBtn.innerText = interfaceUi[currentLang].menu; }

            if (screen) {
                if (currentText === "") {
                    screen.innerText = startTexts[currentLang];
                } else {
                    screen.innerText = currentText;
                }
            }
            if (archiveScreenText) {
                archiveScreenText.innerText = archiveTexts[currentLang];
            }
        }

        function changeLanguage(langCode) {
            currentLang = langCode;

            if (currentText === startTexts['ru'] || currentText === startTexts['en'] || currentText === "") {
                currentText = startTexts[currentLang];
            } else if (currentText === wrongTexts['ru'] || currentText === wrongTexts['en']) {
                currentText = wrongTexts[currentLang];
            } else {
                var screen = document.getElementById("text");
                if (screen) {
                    for (var i = 0; i < gameLevels.length; i++) {
                        if (screen.innerText === gameLevels[i]['ru'] || screen.innerText === gameLevels[i]['en']) {
                            currentText = gameLevels[i][currentLang];
                            break;
                        }
                    }
                }
            }
            updateDisplay();
        }

        function checkCode() {
            var inputField = document.getElementById("userAnswer");
            if (!inputField) return;

            var input = inputField.value.trim(); 
            var found = false;

            if (alertTimeout) {
                clearTimeout(alertTimeout);
            }

            for (var i = 0; i < gameLevels.length; i++) {
                if (gameLevels[i].passwords.includes(input)) {
                    var targetText = gameLevels[i][currentLang];
                    found = true;
                    
                    document.body.classList.remove("error-alert");
                    document.body.classList.add("success-alert");
                    currentText = currentLang === "ru" ? "ДОСТУП РАЗРЕШЕН..." : "ACCESS GRANTED...";
                    updateDisplay();

                    alertTimeout = setTimeout(function() {
                        document.body.classList.remove("success-alert");
                        currentText = targetText;
                        updateDisplay();
                    }, 3000);
                    break;
                }
            }

            if (!found) {
                currentText = wrongTexts[currentLang];
                document.body.classList.add("error-alert");

                alertTimeout = setTimeout(function() {
                    document.body.classList.remove("error-alert");
                    currentText = startTexts[currentLang];
                    updateDisplay();
                }, 5000);
            }

            inputField.value = "";
            updateDisplay();
        }

        function toggleScreens() {
            var gameEl = document.getElementById("gameScreen");
            var archiveEl = document.getElementById("archiveScreen");

            if (currentScreen === "game") {
                gameEl.style.display = "none";
                archiveEl.style.display = "flex";
                currentScreen = "archive";
            } else {
                archiveEl.style.display = "none";
                gameEl.style.display = "flex";
                currentScreen = "game";
            }
        }

        window.onclick = function(event) {
            if (!event.target.matches('.custom-lang-btn')) {
                var dropdown = document.getElementById("langDropdown");
                if (dropdown && dropdown.classList.contains('active')) {
                    dropdown.classList.remove('active');
                }
            }
        }

        // Мобильная оптимизация бегущих строк Keeper Entertainment
        function runBootSequence() {
            var bootScreen = document.getElementById("bootScreen");
            if (!bootScreen) return;
            
            var lines = [
                "KEEPER ENTERTAINMENT BIOS v4.027",
                "PROPERTY OF KEEPER ENTERTAINMENT. ALL RIGHTS RESERVED.",
                "--------------------------------------------------",
                "CPU: Keeper Core(TM) i7 @ 3.40GHz",
                "SPEED: 3400MHz // BUS: 100MHz",
                "MEMORY TEST: 65536MB OK",
                "INITIALIZING STORAGE DEVICES...",
                "DETECTING PRIMARY MASTER ... DISK OK",
                "DETECTING PRIMARY SLAVE  ... NONE",
                "LOADING LOGIC CORE ... DONE",
                "SECURING NETWORK PROTOCOLS ... OK",
                "ESTABLISHING TERMINAL CONNECTION...",
                "CRITICAL WARNING: DATA ENCRYPTION TIMER ACTIVE",
                "LAUNCHING INTERFACE..."
            ];
            
            var currentLine = 0;
            bootScreen.innerText = "";
            
            var bootInterval = setInterval(function() {
                if (currentLine < lines.length) {
                    bootScreen.innerText += lines[currentLine] + "\n";
                    currentLine++;
                } else {
                    clearInterval(bootInterval);
                    bootInterval = null; // Высвобождаем оперативную память устройства
                    bootScreen.style.opacity = "0"; // Плавное скрытие для мобильных систем
                    setTimeout(function() {
                        bootScreen.style.display = "none";
                    }, 300);
                }
            }, 120); // Слегка ускорили для отзывчивости на смартфонах
        }

        window.onload = function () {
            runBootSequence(); 
            var timerElement = document.getElementById("countdownTimer");

            var inputField = document.getElementById("userAnswer");
            if (inputField) {
                inputField.addEventListener("keypress", function(event) {
                    if (event.key === "Enter") {
                        checkCode();
                    }
                });
            }

            var timerInterval = setInterval(function () {
                var now = new Date().getTime();
                var distance = targetDate - now;

                var days = Math.floor(distance / (1000 * 60 * 60 * 24));
                var hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                var minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                var seconds = Math.floor((distance % (1000 * 60)) / 1000);

                days = days < 10 ? "0" + days : days;
                hours = hours < 10 ? "0" + hours : hours;
                minutes = minutes < 10 ? "0" + minutes : minutes;
                seconds = seconds < 10 ? "0" + seconds : seconds;

                if (timerElement) {
                    if (distance > 0) {
                        timerElement.innerText = days + "d " + hours + "h " + minutes + "m " + seconds + "s";
                    } else {
                        clearInterval(timerInterval);
                        timerElement.innerText = currentLang === "ru" ? "[ВРЕМЯ ИСТЕКЛО]" : "[TIME IS UP]";
                    }
                }
            }, 1000);

            updateDisplay();
        };
