<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The End of Beginnings</title>
    <style>
        :root {
            --neon-green: #33ff33;
            --dark-green: #002200;
            --bright-green: #88ff88;
            --neon-red: #ff3333;
            --dark-red: #220000;
            --glow-green: 0 0 10px rgba(51, 255, 51, 0.4);
            --glow-red: 0 0 10px rgba(255, 51, 51, 0.4);
            --glass-glare: radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.05) 0%, rgba(255, 255, 255, 0.02) 40%, rgba(0, 0, 0, 0.4) 100%);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            background-color: #000000;
            color: var(--neon-green);
            font-family: 'Courier New', Courier, monospace;
            height: 100%;
            width: 100%;
            overflow: hidden;
            position: relative;
            text-shadow: var(--glow-green);
            transition: color 0.1s ease;
        }

        body::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.35) 50%), var(--glass-glare);
            z-index: 999;
            background-size: 100% 4px, 100% 100%;
            pointer-events: none;
        }

        body.wrong-flash {
            color: var(--neon-red) !important;
            text-shadow: var(--glow-red) !important;
        }
        body.wrong-flash::before {
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.45) 50%), radial-gradient(circle at 50% 50%, rgba(255, 50, 50, 0.05) 0%, rgba(255, 50, 50, 0.01) 40%, rgba(0, 0, 0, 0.5) 100%) !important;
            background-size: 100% 4px, 100% 100%;
        }
        body.wrong-flash .terminal-input, 
        body.wrong-flash .btn-submit,
        body.wrong-flash .timer-wrapper {
            border-color: var(--neon-red) !important;
            box-shadow: var(--glow-red) !important;
            color: var(--neon-red) !important;
        }
        body.wrong-flash .btn-submit {
            text-shadow: var(--glow-red) !important;
        }
        body.wrong-flash a { color: var(--neon-red) !important; }

        .input-flash-active .terminal-input,
        .input-flash-active .btn-submit {
            background-color: rgba(51, 255, 51, 0.25) !important;
            border-color: var(--bright-green) !important;
            box-shadow: 0 0 25px rgba(51, 255, 51, 0.9) !important;
            color: var(--bright-green) !important;
        }

        #boot-screen {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 13px;
            line-height: 1.4;
            z-index: 10;
            font-weight: bold;
            max-width: 90%;
            height: 90%;
            overflow: hidden;
        }

        #main-container {
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            width: 100%;
            padding: 20px;
            position: relative;
            z-index: 5;
        }

        .timer-wrapper {
            position: absolute;
            top: 6%;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            cursor: pointer;
            padding: 10px 20px;
            border: 2px solid var(--neon-green);
            box-shadow: var(--glow-green);
            background: rgba(0, 0, 0, 0.6);
            min-width: 240px;
            transition: all 0.15s ease;
        }

        .timer-title {
            font-size: 11px;
            margin-bottom: 5px;
            letter-spacing: 1px;
            text-transform: uppercase;
            display: none;
        }

        .timer { font-size: 24px; font-weight: bold; letter-spacing: 1px; }
        .secret-active .timer-title { display: block; }
        .secret-active .timer { font-size: 32px; }

        .terminal-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 550px;
            padding: 10px;
            margin-top: 60px;
        }

        .terminal-output {
            min-height: 110px;
            margin-bottom: 25px;
            text-align: center;
            font-size: 18px;
            width: 100%;
            word-wrap: break-word;
            line-height: 1.5;
            text-transform: uppercase;
        }

        .input-group { display: flex; width: 100%; gap: 10px; }

        .terminal-input {
            flex: 1;
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid var(--neon-green);
            padding: 14px;
            color: var(--neon-green);
            font-family: inherit;
            font-size: 16px;
            outline: none;
            box-shadow: var(--glow-green);
            border-radius: 0;
            transition: all 0.15s ease;
            -webkit-appearance: none;
        }

        .btn-submit {
            background: transparent;
            border: 2px solid var(--neon-green);
            color: var(--neon-green);
            padding: 14px 24px;
            font-family: inherit;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            outline: none;
            box-shadow: var(--glow-green);
            border-radius: 0;
            transition: all 0.15s ease;
        }

        .btn-submit:hover { background: var(--neon-green); color: #000000; text-shadow: none; }
        
        .lang-switch { 
            position: absolute; 
            bottom: 20px; 
            right: 20px; 
            font-size: 15px; 
            font-weight: bold; 
            cursor: pointer; 
            opacity: 0.6; 
            padding: 5px 10px;
            transition: all 0.1s ease;
        }
        
        .lang-switch.rage-mode {
            color: var(--neon-red) !important;
            border: 1px dashed var(--neon-red);
            box-shadow: var(--glow-red);
            text-shadow: var(--glow-red);
            animation: pulse 0.5s infinite alternate;
        }

        @keyframes pulse {
            from { opacity: 0.5; }
            to { opacity: 1; }
        }

        a { color: var(--neon-green); text-decoration: underline; cursor: pointer; pointer-events: auto; }

        @media (max-width: 768px) {
            .timer-wrapper { min-width: 220px; padding: 8px 15px; }
            .timer { font-size: 22px; }
            .secret-active .timer { font-size: 28px; }
            .terminal-output { font-size: 17px; }
        }
        @media (max-width: 480px) {
            #main-container { padding: 10px; }
            .timer-wrapper { top: 4%; width: 85%; min-width: 0; }
            .timer { font-size: 19px; }
            .secret-active .timer { font-size: 22px; }
            .terminal-box { margin-top: 80px; }
            .terminal-output { font-size: 15px; min-height: 120px; margin-bottom: 20px; }
            .input-group { flex-direction: column; gap: 8px; }
            .btn-submit { width: 100%; padding: 12px; }
            .terminal-input { padding: 12px; font-size: 15px; }
        }
    </style>
</head>
<body>
    <div id="boot-screen"></div>
    <div id="main-container">
        <div class="timer-wrapper" id="timer-toggle">
            <div class="timer-title" id="timer-label">До момента x осталось:</div>
            <div class="timer" id="countdown">00:00:00:00</div>
        </div>
        <div class="terminal-box" id="terminal-input-zone">
            <div class="terminal-output" id="response-text">ВВЕДИТЕ ПАРОЛЬ</div>
            <div class="input-group">
                <input type="text" id="user-input" class="terminal-input" autofocus autocomplete="off" placeholder="> ">
                <button id="submit-btn" class="btn-submit">ВВОД</button>
            </div>
        </div>
        <div class="lang-switch" id="lang-btn">EN</div>
    </div>
    <script>
        const targetDate = new Date('2027-02-22T00:00:00').getTime();
        let currentLang = 'ru';
        let isSecretMode = false;
        let isLock = false;
        let currentStep = 0; 
        let langClickCount = 0; 

        const bootLogs = [
            "ROM BIOS v4.01-KEEPER ENTERTAINMENT STAGE 1",
            "COPYRIGHT (C) 1996-2027 KEEPER ENT. ALL RIGHTS RESERVED.",
            "---------------------------------------------------------",
            "CPU: KPR-QUANTUM PRO AT 8.44 GHz",
            "TESTING RAM: 65536 KB ... OK",
            "DETECTING HARD DISK DRIVES ... PRIMARY MASTER: KPR-MASSIVE-SSD 2.04TB",
            "LOAD SECTORS: 0x00FF32 -> 0x77FFA1 ... OK",
            "INITIALIZING MOUSE AND KEYBOARD BUSSES ... OK",
            "GRAPHICS CARD: EMULATOR CRT-TUBE-NEON 512MB ... MATCHED",
            "LOADING KERNEL INTERFACE ... SUCCESS",
            "CONNECTING SECURE UPLINK CHANNELS...",
            "ESTABLISHING ROUTING THROUGH KPR-GATEWAY...",
            "ENCRYPTING SESSION ID ... AES-X-256 ACTIVE",
            "STATUS: ACCESS GRANTED TO KEEPER MAIN TERMINAL.",
            "RUNNING SYSTEM..."
        ];

        const langData = {
            ru: {
                labelSecret: "До момента x осталось:",
                wrong: "НЕПРАВИЛЬНО.",
                emptyWrong: "НЕПРАВИЛЬНО. СЕРЬЕЗНО? ПУСТАЯ СТРОКА?",
                defaultPrompt: "ВВЕДИТЕ ПАРОЛЬ",
                btnText: "ВВОД",
                rageSwitch: "СИСТЕМА УДАЛЕНИЯ",
                rageReply: "ХВАТИТ ИГРАТЬСЯ! ЭТО НЕ ИГРУШКИ!",
                steps: {
                    0: { reply: "Серьезно? Ты жалок. Ладно дам подсказку - 12 + 4." },
                    1: { reply: "Молодец! Кстати столько лет подряд ИИ подбирал бы пароль. Скажи слово побег но без о и е" },
                    2: { reply: "ладно на самом деле у меня нет пароля. Прости, но разбирайся *сам*" },
                    3: { reply: "я же сказал у ме123+123ня ничего нет! Я чист!" },
                    4: { reply: "ДОВОЛЬНО! У МЕНЯ НЕТ ПАРОЛЯ! *!!!!!*" },
                    5: { reply: "Вот пароль! Подавись им и прочь отсюда: va*фwn%чи+adьs>рф\$лнхя'xw1%йкl_5чigpтыои]?еje# !" },
                    6: { reply: "Новая Эра Keeper Ent. вот вот начнется." }
                },
                contempt: [
                    "Хватит тратить мое время.",
                    "Ты бесполезен.",
                    "Доступ запрещен.",
                    "Этот ответ не имеет значения.",
                    "Разговор окончен."
                ],
                freeAnswers: {
                    "67": "Перестань деградировать и займись делом!",
                    "БУРМАЛДА": "не ну ты молодец конечно что за молодежные мемчики шаришь, но это не пароль!",
                    "ПРИВЕТ": "Пока до тех пор пока не найдешь пароль!",
                    "КТО ТЫ": "Терминал, который ждет твоего правильного пароля! Мне не платят за пустую болтовню с тобой!",
                    "ГДЕ Я": "Откуда я то знаю? Ты открыл сайт с поиском пароля, а находится ты можешь где угодно!",
                    "КАКОЙ ПАРОЛЬ": "Ты мне скажи.",
                    "УРАН": "…",
                    "ХАМАМ": "…",
                    "НОВАЯ ЭРА": 'Линк: <a href="https://t.me" target="_blank">https://t.me</a>'
                }
            },
            en: {
                labelSecret: "Until moment x left:",
                wrong: "WRONG.",
                emptyWrong: "WRONG. SERIOUSLY? EMPTY LINE?",
                defaultPrompt: "ENTER PASSWORD",
                btnText: "SUBMIT",
                rageSwitch: "UNFRIEND SYSTEM",
                rageReply: "STOP PLAYING AROUND! THIS IS NOT A TOY!",
                steps: {
                    0: { reply: "Seriously? You are pathetic. Fine, I'll give you a hint - 12 + 4." },
                    1: { reply: "Well done! By the way, that's how many years in a row an AI would brute-force the password. Say the word 'escape' but without vowels" },
                    2: { reply: "fine, the truth is I don't have a password. Sorry, but deal with it *yourself*" },
                    3: { reply: "I ha123+123ve nothing, I told you! I am clean!" },
                    4: { reply: "ENOUGH! I DON'T HAVE A PASSWORD! *!!!!!*" },
                    5: { reply: "Here is the password! Choke on it and get out: va*фwn%чи+adьs>рф\$лнхя'xw1%йкl_5чigpтыои]?еje# !" },
                    6: { reply: "A New Era of Keeper Ent. is about to begin." }
                },
                contempt: [
                    "Stop wasting my time.",
                    "You are useless.",
                    "Access denied.",
                    "Conversation over."
                ],
                freeAnswers: {
                    "67": "Stop degrading and get to work!",
                    "БУРМАЛДА": "Ne nu to molded konechno chto za molodezhnie memchiki sharish, no eto ne parol.",
                    "HELLO": "Bye until you find the password!",
                    "PRIVET": "Bye until you find the password!",
                    "ПРИВЕТ": "Bye until you find the password!",
                    "WHO ARE YOU": "A terminal waiting for your correct password! I don't get paid for empty small talk with you!",
                    "КТО ТЫ": "A terminal waiting for your correct password! I don't get paid for empty small talk with you!",
                    "WHERE AM I": "How should I know? You opened a password search site, you could be anywhere!",
                    "ГДЕ Я": "How should I know? You opened a password search site, you could be anywhere!",
                    "WHAT PASSWORD": "You tell me.",
                    "КАКОЙ ПАРОЛЬ": "You tell me.",
                    "URAN": "…",
                    "УРАН": "…",
                    "HAMAM": "…",
                    "ХАМАМ": "…",
                    "NEW ERA": 'Link: <a href="https://t.me" target="_blank">https://t.me</a>',
                    "НОВАЯ ЭРА": 'Link: <a href="https://t.me" target="_blank">https://t.me</a>'
                }
            }
        };
        const stepTriggers = {
            0: ["ПАРОЛЬ", "PASSWORD"],
            1: ["16"],
            2: ["ПБГ", "ESCAP"],
            3: ["САМ", "YOURSELF"],
            4: ["246"],
            5: ["!!!!!ED"], 
            6: ["VA*ФWN%ЧИ+ADЬS>РФ\$ЛНХЯ'XW1%ЙКL_5ЧIGPТЫОИ]?ЕJE#"]
        };

        const bootScreen = document.getElementById('boot-screen');
        const mainContainer = document.getElementById('main-container');
        let bootLine = 0;

        function printBootLines() {
            if (bootLine < bootLogs.length) {
                bootScreen.innerHTML += bootLogs[bootLine] + '<br>';
                bootScreen.scrollTop = bootScreen.scrollHeight;
                bootLine++;
                setTimeout(printBootLines, 260);
            } else {
                setTimeout(() => {
                    bootScreen.style.display = 'none';
                    mainContainer.style.display = 'flex';
                    document.getElementById('user-input').focus();
                }, 300);
            }
        }
        printBootLines();

        function updateTimer() {
            const distance = targetDate - new Date().getTime();
            const label = document.getElementById('countdown');
            if (!label) return;
            if (distance < 0) {
                label.innerHTML = "00:00:00:00";
                return;
            }
            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            label.innerHTML = `${days < 10 ? '0'+days : days}:${hours < 10 ? '0'+hours : hours}:${minutes < 10 ? '0'+minutes : minutes}:${seconds < 10 ? '0'+seconds : seconds}`;
        }
        setInterval(updateTimer, 1000);
        updateTimer();

        document.getElementById('timer-toggle').addEventListener('click', () => {
            isSecretMode = !isSecretMode;
            mainContainer.classList.toggle('secret-active', isSecretMode);
            document.getElementById('timer-label').innerText = langData[currentLang].labelSecret;
        });

        document.getElementById('lang-btn').addEventListener('click', () => {
            if (isLock) return;
            langClickCount++;
            const langBtn = document.getElementById('lang-btn');

            if (langClickCount > 5) {
                isLock = true;
                const oldText = document.getElementById('response-text').innerHTML;
                document.getElementById('response-text').innerText = langData[currentLang].rageReply;
                document.body.classList.add('wrong-flash');
                
                setTimeout(() => {
                    document.body.classList.remove('wrong-flash');
                    document.getElementById('response-text').innerHTML = oldText;
                    langClickCount = 0;
                    langBtn.classList.remove('rage-mode');
                    langBtn.innerText = currentLang === 'ru' ? 'EN' : 'RU';
                    isLock = false;
                }, 2500);
                return;
            }

            const oldLang = currentLang;
            currentLang = currentLang === 'ru' ? 'en' : 'ru';
            
            if (langClickCount >= 4) {
                langBtn.classList.add('rage-mode');
                langBtn.innerText = langData[currentLang].rageSwitch;
            } else {
                langBtn.innerText = currentLang === 'ru' ? 'EN' : 'RU';
            }

            document.getElementById('timer-label').innerText = langData[currentLang].labelSecret;
            document.getElementById('submit-btn').innerText = langData[currentLang].btnText;
            
            const outputField = document.getElementById('response-text');
            const currentText = outputField.innerHTML;

            if (currentText === langData[oldLang].defaultPrompt) {
                outputField.innerText = langData[currentLang].defaultPrompt;
            } else if (currentStep > 0 && currentText === langData[oldLang].steps[currentStep - 1].reply) {
                outputField.innerText = langData[currentLang].steps[currentStep - 1].reply;
            } else {
                for (const key in langData[oldLang].freeAnswers) {
                    if (currentText === langData[oldLang].freeAnswers[key]) {
                        outputField.innerHTML = langData[currentLang].freeAnswers[key];
                        break;
                    }
                }
            }
        });

        function triggerInputFlash() {
            document.getElementById('terminal-input-zone').classList.add('input-flash-active');
            setTimeout(() => {
                document.getElementById('terminal-input-zone').classList.remove('input-flash-active');
            }, 450);
        }

        function checkCode() {
            if (isLock) return;
            const inputField = document.getElementById('user-input');
            const outputField = document.getElementById('response-text');
            const rawValue = inputField.value;
            const trimmedValue = rawValue.trim();
            
            if (trimmedValue === "") {
                isLock = true;
                outputField.innerText = langData[currentLang].emptyWrong;
                document.body.classList.add('wrong-flash');
                setTimeout(() => {
                    document.body.classList.remove('wrong-flash');
                    outputField.innerText = langData[currentLang].defaultPrompt;
                    isLock = false;
                    inputField.focus();
                }, 3000);
                inputField.value = "";
                return;
            }

            // Абсолютная проверка на пять восклицательных знаков до фильтров регистра
            if (currentStep === 5 && trimmedValue === "!!!!!") {
                triggerInputFlash();
                outputField.innerText = langData[currentLang].steps[currentStep].reply;
                currentStep++;
                inputField.value = "";
                langClickCount = 0;
                return;
            }

            // Стандартный фильтр для остальных шагов
            let cleanCode = trimmedValue.toUpperCase();
            while (cleanCode.length > 0 && ['.', '!', '?', ','].includes(cleanCode[cleanCode.length - 1])) {
                cleanCode = cleanCode.slice(0, -1).trim();
            }

            if (langData[currentLang].freeAnswers[cleanCode] !== undefined) {
                triggerInputFlash();
                outputField.innerHTML = langData[currentLang].freeAnswers[cleanCode];
                inputField.value = "";
                langClickCount = 0;
                return;
            }

            if (currentStep <= 6) {
                const expectedTriggers = stepTriggers[currentStep];
                const isCorrect = expectedTriggers.some(trigger => cleanCode === trigger || cleanCode.includes(trigger));

                if (isCorrect) {
                    triggerInputFlash();
                    outputField.innerText = langData[currentLang].steps[currentStep].reply;
                    if (currentStep < 6) {
                        currentStep++;
                    }
                    inputField.value = "";
                    langClickCount = 0;
                    return;
                }
            }

            isLock = true;
            const randomContempt = langData[currentLang].contempt[Math.floor(Math.random() * langData[currentLang].contempt.length)];
            outputField.innerText = `${langData[currentLang].wrong}\n${randomContempt}`;
            document.body.classList.add('wrong-flash');
            inputField.value = "";

            setTimeout(() => {
                document.body.classList.remove('wrong-flash');
                outputField.innerText = langData[currentLang].defaultPrompt;
                isLock = false;
                inputField.focus();
            }, 3000); 
        }

        document.getElementById('submit-btn').addEventListener('click', checkCode);
        document.getElementById('user-input').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') checkCode();
        });
    </script>
</body>
</html>
