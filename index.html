<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>The End of Beginnings</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000 !important;
            overflow: hidden;
            box-sizing: border-box;
        }

        body {
            color: #00ff00;
            font-family: monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            transition: color 1s ease;
            padding: 15px;
        }

        body.error-alert {
            color: #ff0000 !important;
            transition: none !important;
        }

        body.error-alert .box {
            border-color: #ff0000 !important;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.5) !important;
            transition: none !important;
        }

        body.error-alert input {
            border-color: #ff0000 !important;
            color: #ff0000 !important;
            transition: none !important;
        }

        body.error-alert button.submit-btn {
            background-color: #ff0000 !important;
            transition: none !important;
        }

        body.error-alert .custom-lang-btn, 
        body.error-alert .custom-lang-dropdown,
        body.error-alert .timer-link {
            border-color: #ff0000 !important;
            color: #ff0000 !important;
            transition: none !important;
        }

        body.error-alert .custom-lang-option:hover {
            background: rgba(255, 0, 0, 0.2) !important;
        }

        .box {
            border: 2px solid #00ff00;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            border-radius: 10px;
            background-color: #050505;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.3);
            transition: all 1s ease; 
            max-width: 500px;
            width: 100%;
            max-height: 75vh;
            box-sizing: border-box;
            overflow-y: auto;
        }

        .custom-lang-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 9999;
            font-family: monospace;
        }

        .custom-lang-btn {
            background: #000;
            border: 1px solid #00ff00;
            color: #00ff00;
            padding: 8px 15px;
            font-size: 14px;
            cursor: pointer;
            outline: none;
            transition: all 1s ease;
        }

        .custom-lang-dropdown {
            display: none;
            position: absolute;
            bottom: 100%;
            right: 0;
            margin-bottom: 5px;
            background: #000;
            border: 1px solid #00ff00;
            width: 100%;
            min-width: 110px;
            box-sizing: border-box;
            transition: all 1s ease;
        }

        .custom-lang-dropdown.active {
            display: block;
        }

        .custom-lang-option {
            padding: 8px 12px;
            color: #00ff00;
            cursor: pointer;
            text-align: center;
            font-size: 14px;
        }

        .custom-lang-option:hover {
            background: rgba(0, 255, 0, 0.2);
        }

        .timer-link {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: transparent;
            border: 1px dashed #00ff00;
            color: #00ff00;
            padding: 8px 15px;
            text-decoration: none;
            font-family: monospace;
            font-size: 15px;
            cursor: pointer;
            z-index: 9999;
            transition: border 1s ease, color 1s ease, background 0.2s;
            box-sizing: border-box;
        }

        .timer-link:hover {
            background: rgba(0, 255, 0, 0.1);
            border-style: solid;
        }

        .input-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            width: 100%;
            margin-top: auto;
        }

        input {
            background: #111;
            border: 1px solid #00ff00;
            color: #00ff00;
            padding: 10px;
            font-family: monospace;
            font-size: 16px;
            outline: none;
            transition: all 1s ease;
            width: 100%;
            box-sizing: border-box;
            -webkit-appearance: none;
            border-radius: 0;
        }

        button.submit-btn {
            background: #00ff00;
            color: #000;
            padding: 10px 15px;
            font-weight: bold;
            border: none;
            cursor: pointer;
            font-size: 15px;
            transition: background-color 1s ease;
            box-sizing: border-box;
        }

        button.submit-btn:hover {
            background: #00cc00;
        }
        #text, #archiveText {
            font-size: 20px;
            line-height: 1.4;
            white-space: pre-line;
            text-shadow: 0 0 5px rgba(0, 255, 0, 0.5);
            animation: tv-text-jump 1.6s steps(1) infinite;
            word-wrap: break-word;
            word-break: break-word;
            overflow-wrap: break-word;
        }

        #text {
            margin-bottom: 25px;
            min-height: 60px;
            text-align: center;
        }

        #archiveText {
            text-align: left;
            font-size: 18px;
            line-height: 1.6;
        }

        body.error-alert #text {
            text-shadow: 0 0 7px rgba(255, 0, 0, 0.7);
            animation: tv-text-jump-heavy 0.6s steps(1) infinite;
        }

        @keyframes tv-text-jump {
            0% { transform: translate(0, 0); }
            5% { transform: translate(-0.5px, 0.5px); }
            8% { transform: translate(0, 0); }
            30% { transform: translate(0.5px, -0.5px); }
            33% { transform: translate(0, 0); }
            65% { transform: translate(-0.5px, -0.5px); }
            68% { transform: translate(0, 0); }
            85% { transform: translate(0.5px, 0.5px); }
            88% { transform: translate(0, 0); }
        }

        @keyframes tv-text-jump-heavy {
            0% { transform: translate(0, 0); }
            10% { transform: translate(-1.5px, 0.5px); }
            20% { transform: translate(1px, -1px); }
            30% { transform: translate(0, 0); }
            50% { transform: translate(-1px, -0.5px); }
            60% { transform: translate(1.5px, 0.5px); }
            70% { transform: translate(0, 0); }
            90% { transform: translate(-0.5px, 1px); }
        }

        @media (max-width: 600px) {
            body {
                align-items: center;
                padding: 10px;
            }
            .box {
                padding: 20px 15px;
                max-height: 65vh;
            }
            #text, #archiveText {
                font-size: 15px;
                line-height: 1.4;
            }
            #text {
                margin-bottom: 15px;
                min-height: auto;
            }
            input {
                font-size: 14px;
                padding: 8px;
            }
            button.submit-btn {
                font-size: 13px;
                padding: 8px 12px;
            }
            .timer-link {
                left: 10px;
                bottom: 10px;
                font-size: 12px;
                padding: 5px 8px;
            }
            .custom-lang-container {
                right: 10px;
                bottom: 10px;
            }
            .custom-lang-btn {
                font-size: 12px;
                padding: 5px 10px;
            }
        }
    </style>
</head>
<body>

    <div class="box" id="gameScreen">
        <div id="text"></div>
        <div class="input-container" id="inputContainer">
            <input type="text" id="userAnswer" placeholder="" autocomplete="off">
            <button class="submit-btn" id="submitBtn" onclick="checkCode()">ВВОД</button>
        </div>
    </div>

    <div class="box" id="archiveScreen" style="display: none;">
        <div id="archiveText"></div>
    </div>

    <a href="javascript:void(0)" class="timer-link" id="countdownTimer" onclick="toggleScreens()">00d 00h 00m 00s</a>

    <div class="custom-lang-container">
        <button class="custom-lang-btn" id="langBtn" onclick="toggleLangDropdown()">Русский</button>
        <div class="custom-lang-dropdown" id="langDropdown">
            <div class="custom-lang-option" onclick="selectLanguage('ru')">Русский</div>
            <div class="custom-lang-option" onclick="selectLanguage('en')">English</div>
        </div>
    </div>

    <script>
        var targetDate = new Date(2027, 1, 22, 15, 30, 00).getTime();
        var alertTimeout = null;
        var currentScreen = "game"; 

        var interfaceUi = {
            ru: { btn: "ВВОД", placeholder: "Ваш ответ...", menu: "Русский" },
            en: { btn: "ENTER", placeholder: "Your answer...", menu: "English" }
        };

        var currentLang = "ru";
        var currentText = "";

        var startTexts = {
            ru: "Введите Пароль",
            en: "Enter Password"
        };

        var wrongTexts = {
            ru: "НЕВЕРНО",
            en: "WRONG"
        };

        var archiveTexts = {
            ru: "СТАТУС: ДОСТУП РАЗРЕШЕН // АРХИВ №027\n\n[ЗАПИСЬ ЗАБЛОКИРОВАНА]\n\nВы успешно проникли в базу данных. Система безопасности временно отключена, однако файлы логов зашифрованы главным счетчиком времени.\n\nВернитесь к терминалу через таймер в углу экрана, если готовы продолжить поиски.",
            en: "STATUS: ACCESS GRANTED // ARCHIVE #027\n\n[RECORD LOCKED]\n\nYou have successfully breached the database. The security system is offline, but the logs are encrypted by the main countdown clock.\n\nReturn to the terminal using the timer in the corner if you are ready to continue."
        };

        var gameLevels = [
            {
                passwords: ["что это за место", "what is this place"],
                ru: "Не важно, важно то, что ты здесь забыл! А что именно ты тут забыл - без понятия.",
                en: "It doesn't matter, what matters is that you're here! And what exactly you're here forgot – I have no idea."
            },
            {
                passwords: ["что это за место?", "what is this place?"],
                ru: "Не важно, важно то, что ты здесь забыл! А что именно ты тут забыл - без понятия.",
                en: "It doesn't matter, what matters is that you're here! And what exactly you're here forgot – I have no idea."
            },
            {
                passwords: ["где я", "where am i"],
                ru: "Не важно, важно то, что ты здесь забыл! А что именно ты тут забыл - без понятия.",
                en: "It doesn't matter, what matters is that you're here! And what exactly you're here forgot – I have no idea."
            },
            {
                passwords: ["где я?", "where am i?"],
                ru: "Не важно, важно то, что ты здесь забыл! А что именно ты тут забыл - без понятия.",
                en: "It doesn't matter, what matters is that you're here! And what exactly you're here forgot – I have no idea."
            },
            {
                passwords: ["пароль", "password"],
                ru: "Таких глупых мы еще не встречали. Ты правда думаешь, что этот секрет можно узнать, всего лишь написав *Пароль*?",
                en: "We've never met such stupid people. Do you really think this secret can be found out just by typing *Password*?"
            },
            {
                passwords: ["кто ты", "who are you"],
                ru: "Терминал, отвечающий на твои глупые вопросы, в надежде на то, что ты найдешь пароль!",
                en: "A terminal that answers your stupid questions, in the hope that you'll find password!"
            },
            {
                passwords: ["кто ты?", "who are you?"],
                ru: "Терминал, отвечающий на твои глупые вопросы, в надежде на то, что ты найдешь пароль!",
                en: "A terminal that answers your stupid questions, in the hope that you'll find password!"
            },
            {
                passwords: ["а какой пароль", "what is the password"],
                ru: "Ты мне скажи.",
                en: "You tell me."
            },
            {
                passwords: ["а какой пароль?", "what is the password?"],
                ru: "Ты мне скажи.",
                en: "You tell me."
            },
            {
                passwords: ["keeper entertainment", "keeper entertainment"],
                ru: "Новая Эра Грядет.",
                en: "A New Era is Coming."
            },
            {
                passwords: ["новая эра", "new era"],
                ru: "https://t.me",
                en: "https://t.me"
            },
            {
                passwords: ["бурмалда", "burmalda"],
                ru: "Не ну ты бурмалдец конечно, что шаришь за молодежные мемчики, но это не пароль!",
                en: "Ne ny ti burmaldec conechno, chto sharish za molodezhnie memchiki, no eto ne parol!"
            },
            {
                passwords: ["67", "67"],
                ru: "Да найди ты пароль и не страдай фигней! На край попробуй что то спросить! Может отвечу.",
                en: "Just find the password and stop messing around! At least try asking something! Maybe I'll answer."
            },
            {
                passwords: ["tkom4", "tkom4"],
                ru: "...",
                en: "..."
            },
            {
                passwords: ["the king of monsters 4", "the king of monsters 4"],
                ru: "...",
                en: "..."
            },
            {
                passwords: ["va*фwn%чи+adьу>рф$лнхя'xw1%йкl_;5чigpтыои]?еje#", "va*фwn%чи+adьу>рф$лнхя'xw1%йкl_;5чigpтыои]?еje#"],
                ru: "Наконец-то ты нашел пароль. Это было сложно, знаю, но теперь я расскажу тебе тайну. Команда Keeper Entertainment действительно закончила эру Майнкрафта, но вот настоящая игровая эра только начинает свое существование.",
                en: "You've finally found the password. It was hard, I know, but now I'll tell you a secret. The Keeper Entertainment team may have ended the Minecraft era, but the true gaming era is just beginning."
            }
        ];
        function toggleLangDropdown() {
            document.getElementById("langDropdown").classList.toggle("active");
        }

        function selectLanguage(langCode) {
            document.getElementById("langDropdown").classList.remove("active");
            changeLanguage(langCode);
        }

        function updateDisplay() {
            var screen = document.getElementById("text");
            var archiveScreenText = document.getElementById("archiveText");
            var inputField = document.getElementById("userAnswer");
            var submitBtn = document.getElementById("submitBtn");
            var langBtn = document.getElementById("langBtn");

            if (submitBtn) { submitBtn.innerText = interfaceUi[currentLang].btn; }
            if (inputField) { inputField.placeholder = interfaceUi[currentLang].placeholder; }
            if (langBtn) { langBtn.innerText = interfaceUi[currentLang].menu; }

            if (screen) {
                if (currentText === "") {
                    screen.innerText = startTexts[currentLang];
                } else {
                    screen.innerText = currentText;
                }
            }

            if (archiveScreenText) {
                archiveScreenText.innerText = archiveTexts[currentLang];
            }
        }

        function changeLanguage(langCode) {
            currentLang = langCode;

            if (currentText === startTexts['ru'] || currentText === startTexts['en'] || currentText === "") {
                currentText = startTexts[currentLang];
            } else if (currentText === wrongTexts['ru'] || currentText === wrongTexts['en']) {
                currentText = wrongTexts[currentLang];
            } else {
                var screen = document.getElementById("text");
                if (screen) {
                    for (var i = 0; i < gameLevels.length; i++) {
                        if (screen.innerText === gameLevels[i]['ru'] || screen.innerText === gameLevels[i]['en']) {
                            currentText = gameLevels[i][currentLang];
                            break;
                        }
                    }
                }
            }
            updateDisplay();
        }

        function checkCode() {
            var inputField = document.getElementById("userAnswer");
            if (!inputField) return;

            var input = inputField.value.toLowerCase().trim();
            var found = false;

            if (alertTimeout) {
                clearTimeout(alertTimeout);
            }

            for (var i = 0; i < gameLevels.length; i++) {
                if (gameLevels[i].passwords.includes(input)) {
                    currentText = gameLevels[i][currentLang];
                    found = true;
                    document.body.classList.remove("error-alert");
                    break;
                }
            }

            if (!found) {
                currentText = wrongTexts[currentLang];
                document.body.classList.add("error-alert");

                alertTimeout = setTimeout(function() {
                    document.body.classList.remove("error-alert");
                    currentText = startTexts[currentLang];
                    updateDisplay();
                }, 5000);
            }

            inputField.value = "";
            updateDisplay();
        }

        function toggleScreens() {
            var gameEl = document.getElementById("gameScreen");
            var archiveEl = document.getElementById("archiveScreen");

            if (currentScreen === "game") {
                gameEl.style.display = "none";
                archiveEl.style.display = "flex";
                currentScreen = "archive";
            } else {
                archiveEl.style.display = "none";
                gameEl.style.display = "flex";
                currentScreen = "game";
            }
        }

        window.onclick = function(event) {
            if (!event.target.matches('.custom-lang-btn')) {
                var dropdown = document.getElementById("langDropdown");
                if (dropdown && dropdown.classList.contains('active')) {
                    dropdown.classList.remove('active');
                }
            }
        }

        window.onload = function () {
            var timerElement = document.getElementById("countdownTimer");

            var inputField = document.getElementById("userAnswer");
            if (inputField) {
                inputField.addEventListener("keypress", function(event) {
                    if (event.key === "Enter") {
                        checkCode();
                    }
                });
            }

            var timerInterval = setInterval(function () {
                var now = new Date().getTime();
                var distance = targetDate - now;

                var days = Math.floor(distance / (1000 * 60 * 60 * 24));
                var hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                var minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                var seconds = Math.floor((distance % (1000 * 60)) / 1000);

                days = days < 10 ? "0" + days : days;
                hours = hours < 10 ? "0" + hours : hours;
                minutes = minutes < 10 ? "0" + minutes : minutes;
                seconds = seconds < 10 ? "0" + seconds : seconds;

                if (timerElement) {
                    if (distance > 0) {
                        timerElement.innerText = days + "d " + hours + "h " + minutes + "m " + seconds + "s";
                    } else {
                        clearInterval(timerInterval);
                        timerElement.innerText = currentLang === "ru" ? "[ВРЕМЯ ИСТЕКЛО]" : "[TIME IS UP]";
                    }
                }
            }, 1000);

            updateDisplay();
        };
    </script>
</body>
</html>
