<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>The End of Begginings</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
        }

        /* Главный контейнер (без тяжелых анимаций) */
        body {
            color: #00ff00;
            font-family: monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

            /* КРАСНАЯ ТРЕВОГА ПРИ ОШИБКЕ */
            body.error-alert {
                color: #ff0000 !important;
            }

                body.error-alert .box {
                    border-color: #ff0000 !important;
                    box-shadow: 0 0 15px rgba(255, 0, 0, 0.5) !important;
                }

                body.error-alert input {
                    border-color: #ff0000 !important;
                    color: #ff0000 !important;
                }

                body.error-alert button.submit-btn {
                    background-color: #ff0000 !important;
                }

                body.error-alert .lang-menu, body.error-alert .timer-link {
                    border-color: #ff0000 !important;
                    color: #ff0000 !important;
                }

        .box {
            border: 2px solid #00ff00;
            padding: 40px;
            display: inline-block;
            border-radius: 10px;
            background-color: #050505;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.3);
            transition: all 0.1s ease;
        }

        .lang-menu {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #000;
            border: 1px solid #00ff00;
            color: #00ff00;
            padding: 8px 12px;
            font-family: monospace;
            font-size: 14px;
            z-index: 9999;
            outline: none;
            cursor: pointer;
        }

            .lang-menu option {
                background: #000;
                color: #00ff00;
            }

        /* ТАЙМЕР-ССЫЛКА В ЛЕВОМ УГЛУ ЭКРАНА */
        .timer-link {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: transparent;
            border: 1px dashed #00ff00;
            color: #00ff00;
            padding: 8px 15px;
            text-decoration: none;
            font-family: monospace;
            font-size: 16px;
            cursor: pointer;
            z-index: 9999;
            transition: all 0.2s;
        }

            .timer-link:hover {
                background: rgba(0, 255, 0, 0.1);
                border-style: solid;
            }

        .input-container {
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        input {
            background: #111;
            border: 1px solid #00ff00;
            color: #00ff00;
            padding: 10px;
            font-family: monospace;
            font-size: 18px;
            outline: none;
        }

        button.submit-btn {
            background: #00ff00;
            color: #000;
            padding: 10px 20px;
            font-weight: bold;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }

            button.submit-btn:hover {
                background: #00cc00;
            }

        /* Текст терминала со свечением */
        #text {
            margin-bottom: 25px;
            font-size: 20px;
            min-height: 50px;
            max-width: 400px;
            line-height: 1.4;
            white-space: pre-line;
            text-shadow: 0 0 5px rgba(0, 255, 0, 0.5);
        }
    </style>
</head>
<body>

    <div class="box">
        <!-- Экран с текстом -->
        <div id="text"></div>

        <!-- Поле ввода и кнопка -->
        <div class="input-container" id="inputContainer">
            <input type="text" id="userAnswer" placeholder="" autocomplete="off">
            <button class="submit-btn" id="submitBtn" onclick="checkCode()">ВВОД</button>
        </div>
    </div>

    <!-- ТАЙМЕР-ССЫЛКА НА ВТОРОЙ САЙТ (Поменяй Ссылку на свой второй сайт прямо тут в href) -->
    <a href="https://secretofbeggining.netlify.app/" target="_blank" class="timer-link" id="countdownTimer">00d 00h 00m 00s</a>

    <!-- Выбор языка (Строго 2 варианта) -->
    <select class="lang-menu" id="langSelect" onchange="changeLanguage(this.value)">
        <option value="ru">Русский</option>
        <option value="en">English</option>
    </select>
    <script>
        // ТАЙМЕР: 22 февраля 2027 года в 15:30:00 (Месяц 1 = Февраль)
        var targetDate = new Date(2027, 1, 22, 15, 30, 00).getTime();

        var interfaceUi = {
            ru: { btn: "ВВОД", placeholder: "Ваш ответ..." },
            en: { btn: "ENTER", placeholder: "Your answer..." }
        };

        var currentLang = "ru";
        var currentText = "";

        var startTexts = {
            ru: "Введите Пароль",
            en: "Enter Password"
        };

        var wrongTexts = {
            ru: "НЕВЕРНО",
            en: "WRONG"
        };

        // ТВОЯ НАСТРОЙКА УРОВНЕЙ И ПАРОЛЕЙ
        var gameLevels = [
            {
                passwords: ["что это за место", "what is this place"],
                ru: "Не важно, важно то, что ты здесь забыл! А что именно ты тут забыл - без понятия.",
                en: "It doesn't matter, what matters is that you're here! And what exactly you're here forgot – I have no idea."
            },
            {
                passwords: ["пароль", "password"],
                ru: "Таких глупых мы еще не встречали. Ты правда думаешь, что этот секрет можно узнать, всего лишь написав *Пароль*?",
                en: "We've never met such stupid people. Do you really think this secret can be found out just by typing *Password*?"
            },
            {
                passwords: ["кто ты", "who are you"],
                ru: "Терминал, отвечающий на твои глупые вопросы, в надежде на то, что ты найдешь его!",
                en: "A terminal that answers your stupid questions, in the hope that you'll find it!"
            },
            {
                passwords: ["а какой пароль", "what is the password"],
                ru: "Ты мне скажи.",
                en: "You tell me."
            },
            {
                passwords: ["keeper entertainment", "keeper entertainment"],
                ru: "Новая Эра Грядет.",
                en: "A New Era is Coming."
            },
            {
                passwords: ["новая эра", "new era"],
                ru: "Новая Эра Грядет.",
                en: "A New Era is Coming."
            },
            {
                passwords: ["финал", "final"],
                ru: "Поздравляю! Ты прошел ARG до самого конца. Секретов больше нет.",
                en: "Congratulations! You completed the ARG. No more secrets."
            }
        ];

        function updateDisplay() {
            var screen = document.getElementById("text");
            var inputField = document.getElementById("userAnswer");
            var submitBtn = document.getElementById("submitBtn");

            if (submitBtn) { submitBtn.innerText = interfaceUi[currentLang].btn; }
            if (inputField) { inputField.placeholder = interfaceUi[currentLang].placeholder; }

            if (screen) {
                if (currentText === "") {
                    screen.innerText = startTexts[currentLang];
                } else {
                    screen.innerText = currentText;
                }
            }
        }

        function changeLanguage(langCode) {
            currentLang = langCode;

            if (currentText === startTexts['ru'] || currentText === startTexts['en'] || currentText === "") {
                currentText = startTexts[currentLang];
            } else if (currentText === wrongTexts['ru'] || currentText === wrongTexts['en']) {
                currentText = wrongTexts[currentLang];
            } else {
                var screen = document.getElementById("text");
                if (screen) {
                    for (var i = 0; i < gameLevels.length; i++) {
                        if (screen.innerText === gameLevels[i]['ru'] || screen.innerText === gameLevels[i]['en']) {
                            currentText = gameLevels[i][currentLang];
                            break;
                        }
                    }
                }
            }
            updateDisplay();
        }

        function checkCode() {
            var input = document.getElementById("userAnswer").value.toLowerCase().trim();
            var found = false;

            for (var i = 0; i < gameLevels.length; i++) {
                if (gameLevels[i].passwords.includes(input)) {
                    currentText = gameLevels[i][currentLang];
                    found = true;
                    document.body.classList.remove("error-alert");
                    break;
                }
            }

            if (!found) {
                currentText = wrongTexts[currentLang];
                document.body.classList.add("error-alert");
            }

            document.getElementById("userAnswer").value = "";
            updateDisplay();
        }

        // Запуск таймера сразу при открытии страницы
        window.onload = function () {
            var timerElement = document.getElementById("countdownTimer");

            var timerInterval = setInterval(function () {
                var now = new Date().getTime();
                var distance = targetDate - now;

                var days = Math.floor(distance / (1000 * 60 * 60 * 24));
                var hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                var minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                var seconds = Math.floor((distance % (1000 * 60)) / 1000);

                days = days < 10 ? "0" + days : days;
                hours = hours < 10 ? "0" + hours : hours;
                minutes = minutes < 10 ? "0" + minutes : minutes;
                seconds = seconds < 10 ? "0" + seconds : seconds;

                if (timerElement) {
                    if (distance > 0) {
                        timerElement.innerText = days + "d " + hours + "h " + minutes + "m " + seconds + "s";
                    } else {
                        clearInterval(timerInterval);
                        timerElement.innerText = currentLang === "ru" ? "[ВРЕМЯ ИСТЕКЛО]" : "[TIME IS UP]";
                    }
                }
            }, 1000);

            updateDisplay();
        };
    </script>

</body>
