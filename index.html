<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>The End of Beginnings</title>
    <style>
        :root { --bg: #000; --green: #00ff33; --light: #66ff88; --red: #ff0033; --glow: 0 0 10px rgba(0,255,51,0.7); }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', monospace; }
        body { background: var(--bg); color: var(--green); height: 100vh; overflow: hidden; position: relative; transition: background 0.1s; }
        body.flash-success { background: var(--light); }
        body.flash-error { background: var(--red); }
        #boot-screen { position: absolute; top: 20px; left: 20px; font-size: 14px; line-height: 1.5; white-space: pre-wrap; z-index: 10; }
        #main-ui { display: none; flex-direction: column; justify-content: space-between; height: 100%; padding: 40px; }
        .timer-box { text-align: center; cursor: pointer; user-select: none; }
        #timer-title { font-size: 14px; margin-bottom: 5px; text-transform: uppercase; opacity: 0.7; }
        #timer { font-size: 32px; font-weight: bold; text-shadow: var(--glow); }
        .secret-timer #timer { font-size: 64px; }
        .term-box { align-self: center; text-align: center; max-width: 600px; width: 100%; }
        #output { min-height: 50px; margin-bottom: 20px; font-size: 18px; text-shadow: var(--glow); }
        .input-row { display: flex; justify-content: center; gap: 10px; }
        #input { background: transparent; border: 1px solid var(--green); color: var(--green); padding: 10px; font-size: 18px; width: 70%; outline: none; }
        #btn { background: transparent; border: 1px solid var(--green); color: var(--green); padding: 10px 20px; font-size: 16px; cursor: pointer; text-transform: uppercase; }
        #btn:hover { background: var(--green); color: #000; box-shadow: var(--glow); }
        .langs { position: absolute; bottom: 40px; right: 40px; font-size: 16px; }
        .lang-btn { cursor: pointer; opacity: 0.5; }
        .lang-btn.active { opacity: 1; font-weight: bold; text-shadow: var(--glow); }
        body.flash-error * { color: #000 !important; text-shadow: none !important; border-color: #000 !important; }
        body.flash-success * { color: #000 !important; text-shadow: none !important; border-color: #000 !important; }
    </style>
</head>
<body>
    <div id="boot-screen"></div>
    <div id="main-ui">
        <div class="timer-box" id="timer-toggle">
            <div id="timer-title"></div>
            <div id="timer">00:00:00:00</div>
        </div>
        <div class="term-box">
            <div id="output"></div>
            <div class="input-row">
                <input type="text" id="input" autofocus autocomplete="off">
                <button id="btn">Ввод</button>
            </div>
        </div>
        <div class="langs"><span id="ru" class="lang-btn active">RU</span> / <span id="en" class="lang-btn">EN</span></div>
    </div>
    <script>
        const PWD = `va*фwn%чи+adьs>рф$лнхя'xw1%йкl_5чigpтыои]?еje#_`;
        const TARGET = new Date('February 22, 2027 00:00:00').getTime();
        const LANGS = {
            ru: { btn: "Ввод", tNorm: "", tSec: "Отсчет до момента x", hi: "Терминал готов к приему директив...", win: "Новая Эра Keeper Ent. вот вот начнется.", eEmpty: "Поговорить захотелось? Мимо.", eWrong: "Мусор. Попробуй еще раз.", eSpam: "Уймись, машина думает быстрее тебя." },
            en: { btn: "Enter", tNorm: "", tSec: "Countdown to moment x", hi: "Terminal is ready for directives...", win: "A New Era of Keeper Ent. is about to begin.", eEmpty: "Want to chat? Denied.", eWrong: "Garbage. Try again.", eSpam: "Slow down. The machine thinks faster." }
        };
        let curLang = 'ru', isSec = false, lastTime = 0, bIdx = 0;
        const lines = ["LOADING KEEPER_ENT_CORE...", "CHECKING PROTOCOLS... OK", "CONNECTING TO NODES... SUCCESS", "DECRYPTING ARCHIVE... 100%", "WARNING: UNAUTHORIZED ACCESS", "INITIALIZING INTERFACE...", "READY."];
        
        const boot = document.getElementById('boot-screen'), ui = document.getElementById('main-ui'),
              tEl = document.getElementById('timer'), tTitle = document.getElementById('timer-title'),
              out = document.getElementById('output'), inp = document.getElementById('input'),
              btn = document.getElementById('btn'), ruBtn = document.getElementById('ru'), enBtn = document.getElementById('en');

        function printBoot() {
            if (bIdx < lines.length) { boot.innerHTML += lines[bIdx++] + "\n"; setTimeout(printBoot, Math.random() * 200 + 50); }
            else { setTimeout(() => { boot.style.display = 'none'; ui.style.display = 'flex'; upLang(curLang); inp.focus(); }, 500); }
        }
        printBoot();

        function upTimer() {
            const diff = TARGET - Date.now();
            if (diff < 0) { tEl.innerHTML = "00:00:00:00"; return; }
            const d = Math.floor(diff / 86400000), h = Math.floor((diff % 86400000) / 3600000), m = Math.floor((diff % 3600000) / 60000), s = Math.floor((diff % 60000) / 1000);
            tEl.innerHTML = `${String(d).padStart(2,'0')}:${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
        }
        setInterval(upTimer, 1000); upTimer();

        document.getElementById('timer-toggle').addEventListener('click', () => {
            isSec = !isSec; ui.classList.toggle('secret-timer', isSec); upLang(curLang);
        });

        function flash(cls, time) { document.body.classList.add(cls); setTimeout(() => document.body.classList.remove(cls), time); }

        function check() {
            const val = inp.value.trim(), now = Date.now();
            if (now - lastTime < 800) { out.innerText = LANGS[curLang].eSpam; flash('flash-error', 300); return; }
            lastTime = now;
            if (val === "") { out.innerText = LANGS[curLang].eEmpty; flash('flash-error', 300); }
            else if (val === PWD) { out.innerText = LANGS[curLang].win; flash('flash-success', 1500); inp.disabled = btn.disabled = true; }
            else { out.innerText = LANGS[curLang].eWrong; flash('flash-error', 300); inp.value = ''; }
        }

        btn.addEventListener('click', check);
        inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') check(); });

        function upLang(l) {
            curLang = l; btn.innerText = LANGS[l].btn; tTitle.innerText = isSec ? LANGS[l].tSec : LANGS[l].tNorm;
            if (out.innerText === "" || out.innerText === LANGS.ru.hi || out.innerText === LANGS.en.hi) out.innerText = LANGS[l].hi;
        }
        ruBtn.addEventListener('click', () => { ruBtn.classList.add('active'); enBtn.classList.remove('active'); upLang('ru'); });
        enBtn.addEventListener('click', () => { enBtn.classList.add('active'); ruBtn.classList.remove('active'); upLang('en'); });
    </script>
</body>
</html>
