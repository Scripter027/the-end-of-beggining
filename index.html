<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The End of Beginnings</title>
    <style>
        :root {
            --neon-green: #33ff33;
            --dark-green: #002200;
            --bright-green: #88ff88;
            --neon-red: #ff3333;
            --dark-red: #220000;
            --glow-green: 0 0 10px rgba(51, 255, 51, 0.4);
            --glow-red: 0 0 10px rgba(255, 51, 51, 0.4);
            --glass-glare: radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.05) 0%, rgba(255, 255, 255, 0.02) 40%, rgba(0, 0, 0, 0.4) 100%);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            background-color: #000000;
            color: var(--neon-green);
            font-family: 'Courier New', Courier, monospace;
            height: 100%;
            width: 100%;
            overflow: hidden;
            position: relative;
            text-shadow: var(--glow-green);
            transition: color 0.1s ease;
        }

        body::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.35) 50%), var(--glass-glare);
            z-index: 999;
            background-size: 100% 4px, 100% 100%;
            pointer-events: none;
        }

        body.wrong-flash {
            color: var(--neon-red) !important;
            text-shadow: var(--glow-red) !important;
        }
        body.wrong-flash::before {
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.45) 50%), radial-gradient(circle at 50% 50%, rgba(255, 50, 50, 0.05) 0%, rgba(255, 50, 50, 0.01) 40%, rgba(0, 0, 0, 0.5) 100%) !important;
            background-size: 100% 4px, 100% 100%;
        }
        body.wrong-flash .terminal-input, 
        body.wrong-flash .btn-submit,
        body.wrong-flash .timer-wrapper {
            border-color: var(--neon-red) !important;
            box-shadow: var(--glow-red) !important;
            color: var(--neon-red) !important;
        }
        body.wrong-flash .btn-submit { text-shadow: var(--glow-red) !important; }
        body.wrong-flash a { color: var(--neon-red) !important; }

        .input-flash-active .terminal-input,
        .input-flash-active .btn-submit {
            background-color: rgba(51, 255, 51, 0.25) !important;
            border-color: var(--bright-green) !important;
            box-shadow: 0 0 25px rgba(51, 255, 51, 0.9) !important;
            color: var(--bright-green) !important;
        }

        #boot-screen {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 13px;
            line-height: 1.4;
            z-index: 10;
            font-weight: bold;
            max-width: 90%;
            height: 90%;
            overflow: hidden;
        }

        #main-container {
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            width: 100%;
            padding: 20px;
            position: relative;
            z-index: 5;
        }

        .timer-wrapper {
            position: absolute;
            top: 6%;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            cursor: pointer;
            padding: 10px 20px;
            border: 2px solid var(--neon-green);
            box-shadow: var(--glow-green);
            background: rgba(0, 0, 0, 0.6);
            min-width: 240px;
            transition: all 0.15s ease;
        }

        .timer-title {
            font-size: 11px;
            margin-bottom: 5px;
            letter-spacing: 1px;
            text-transform: uppercase;
            display: none;
        }

        .timer { font-size: 24px; font-weight: bold; letter-spacing: 1px; }
        .secret-active .timer-title { display: block; }
        .secret-active .timer { font-size: 32px; }

        .terminal-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 550px;
            padding: 10px;
            margin-top: 60px;
        }

        .terminal-output {
            min-height: 110px;
            margin-bottom: 25px;
            text-align: center;
            font-size: 18px;
            width: 100%;
            word-wrap: break-word;
            line-height: 1.5;
            text-transform: uppercase;
        }

        .input-group { display: flex; width: 100%; gap: 10px; }

        .terminal-input {
            flex: 1;
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid var(--neon-green);
            padding: 14px;
            color: var(--neon-green);
            font-family: inherit;
            font-size: 16px;
            outline: none;
            box-shadow: var(--glow-green);
            border-radius: 0;
            transition: all 0.15s ease;
            -webkit-appearance: none;
        }

        .btn-submit {
            background: transparent;
            border: 2px solid var(--neon-green);
            color: var(--neon-green);
            padding: 14px 24px;
            font-family: inherit;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            outline: none;
            box-shadow: var(--glow-green);
            border-radius: 0;
            transition: all 0.15s ease;
        }

        .btn-submit:hover { background: var(--neon-green); color: #000000; text-shadow: none; }
        
        .lang-switch { 
            position: absolute; 
            bottom: 20px; 
            right: 20px; 
            font-size: 15px; 
            font-weight: bold; 
            cursor: pointer; 
            opacity: 0.6; 
            padding: 5px 10px;
            transition: all 0.1s ease;
        }
        
        .lang-switch.rage-mode {
            color: var(--neon-red) !important;
            border: 1px dashed var(--neon-red);
            box-shadow: var(--glow-red);
            text-shadow: var(--glow-red);
            animation: pulse 0.5s infinite alternate;
        }

        @keyframes pulse { from { opacity: 0.5; } to { opacity: 1; } }
        a { color: var(--neon-green); text-decoration: underline; cursor: pointer; pointer-events: auto; }

        @media (max-width: 768px) {
            .timer-wrapper { min-width: 220px; padding: 8px 15px; }
            .timer { font-size: 22px; }
            .secret-active .timer { font-size: 28px; }
            .terminal-output { font-size: 17px; }
        }
        @media (max-width: 480px) {
            #main-container { padding: 10px; }
            .timer-wrapper { top: 4%; width: 85%; min-width: 0; }
            .timer { font-size: 19px; }
            .secret-active .timer { font-size: 22px; }
            .terminal-box { margin-top: 80px; }
            .terminal-output { font-size: 15px; min-height: 120px; margin-bottom: 20px; }
            .input-group { flex-direction: column; gap: 8px; }
            .btn-submit { width: 100%; padding: 12px; }
            .terminal-input { padding: 12px; font-size: 15px; }
        }
    </style>
</head>

                isLock = true;
                const oldText = document.getElementById('response-text').innerHTML;
                document.getElementById('response-text').innerText = d(langData[currentLang].rageReply);
                document.body.classList.add('wrong-flash');
                setTimeout(() => {
                    document.body.classList.remove('wrong-flash');
                    document.getElementById('response-text').innerHTML = oldText;
                    langClickCount = 0;
                    langBtn.classList.remove('rage-mode');
                    langBtn.innerText = currentLang === 'ru' ? 'EN' : 'RU';
                    isLock = false;
                }, 2500);
                return;
            }

            const oldLang = currentLang;
            currentLang = currentLang === 'ru' ? 'en' : 'ru';
            langBtn.innerText = langClickCount >= 4 ? d(langData[currentLang].rageSwitch) : (currentLang === 'ru' ? 'EN' : 'RU');
            if(langClickCount >= 4) langBtn.classList.add('rage-mode');

            document.getElementById('timer-label').innerText = d(langData[currentLang].labelSecret);
            document.getElementById('submit-btn').innerText = d(langData[currentLang].btnText);
            
            const outputField = document.getElementById('response-text');
            const currentText = outputField.innerHTML;

            if (currentText === d(langData[oldLang].defaultPrompt)) {
                outputField.innerText = d(langData[currentLang].defaultPrompt);
            } else if (currentStep > 0 && currentText === d(langData[oldLang].steps[currentStep - 1])) {
                outputField.innerText = d(langData[currentLang].steps[currentStep - 1]);
            } else if (currentText.includes(tgConfig.link)) {
                outputField.innerHTML = (currentLang === 'ru' ? tgConfig.textRu : tgConfig.textEn) + `<a href="${tgConfig.link}" target="_blank">${tgConfig.link}</a>`;
            } else {
                for (const key in langData[oldLang].freeAnswers) {
                    if (currentText === d(langData[oldLang].freeAnswers[key])) {
                        outputField.innerHTML = d(langData[currentLang].freeAnswers[key]);
                        break;
                    }
                }
            }
        });
        function triggerInputFlash() {
            document.getElementById('terminal-input-zone').classList.add('input-flash-active');
            setTimeout(() => { document.getElementById('terminal-input-zone').classList.remove('input-flash-active'); }, 450);
        }

        async function checkCode() {
            if (isLock) return;
            const inputField = document.getElementById('user-input');
            const outputField = document.getElementById('response-text');
            const rawValue = inputField.value;
            const trimmedValue = rawValue.trim();
            
            if (trimmedValue === "") {
                isLock = true;
                outputField.innerText = d(langData[currentLang].emptyWrong);
                document.body.classList.add('wrong-flash');
                setTimeout(() => {
                    document.body.classList.remove('wrong-flash');
                    outputField.innerText = d(langData[currentLang].defaultPrompt);
                    isLock = false;
                    inputField.focus();
                }, 3000);
                inputField.value = "";
                return;
            }

            if (currentStep === 5 && trimmedValue === "!!!!!") {
                triggerInputFlash();
                outputField.innerText = d(langData[currentLang].steps[currentStep]);
                currentStep++;
                inputField.value = "";
                langClickCount = 0;
                return;
            }

            let cleanCode = trimmedValue.toUpperCase();
            while (cleanCode.length > 0 && ['.', '!', '?', ','].includes(cleanCode[cleanCode.length - 1])) {
                cleanCode = cleanCode.slice(0, -1).trim();
            }

            const inputHash = await sha256(cleanCode);

            if (cleanCode === "НОВАЯ ЭРА" || cleanCode === "NEW ERA") {
                triggerInputFlash();
                outputField.innerHTML = (currentLang === 'ru' ? tgConfig.textRu : tgConfig.textEn) + `<a href="${tgConfig.link}" target="_blank">${tgConfig.link}</a>`;
                inputField.value = "";
                langClickCount = 0;
                return;
            }

            const upperHash = inputHash.toUpperCase();
            if (freeHashes[upperHash] !== undefined) {
                const answerKey = freeHashes[upperHash];
                triggerInputFlash();
                outputField.innerHTML = d(langData[currentLang].freeAnswers[answerKey]);
                inputField.value = "";
                langClickCount = 0;
                return;
            }

            if (currentStep <= 6) {
                let isCorrect = false;
                
                if (currentStep === 6) {
                    if (cleanCode === "VA*ФWN%ЧИ+ADЬS>РФ\$ЛНХЯ'XW1%ЙКL_5ЧIGPТЫОИ]?ЕJE#") {
                        isCorrect = true;
                    }
                } else {
                    const validHashes = stepHashes[currentStep];
                    isCorrect = validHashes.includes(inputHash);
                }

                if (isCorrect) {
                    triggerInputFlash();
                    outputField.innerText = d(langData[currentLang].steps[currentStep]);
                    if (currentStep < 6) currentStep++;
                    inputField.value = "";
                    langClickCount = 0;
                    return;
                }
            }

            isLock = true;
            const contemptList = langData[currentLang].contempt;
            const randomContempt = d(contemptList[Math.floor(Math.random() * contemptList.length)]);
            outputField.innerText = `${d(langData[currentLang].wrong)}\n${randomContempt}`;
            document.body.classList.add('wrong-flash');
            inputField.value = "";

            setTimeout(() => {
                document.body.classList.remove('wrong-flash');
                outputField.innerText = d(langData[currentLang].defaultPrompt);
                isLock = false;
                inputField.focus();
            }, 3000); 
        }

        document.getElementById('submit-btn').addEventListener('click', checkCode);
        document.getElementById('user-input').addEventListener('keydown', (e) => { if (e.key === 'Enter') checkCode(); });
        
        document.getElementById('submit-btn').innerText = d(langData[currentLang].btnText);
    </script>
</body>
</html>
