<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The End of Beginnings</title>
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            background-color: #000000;
            color: #39FF14;
            overflow: hidden;
            height: 100vh;
            position: relative;
        }

        .glitch-element {
            animation: terminal-shake 0.3s infinite alternate;
        }

        @keyframes terminal-shake {
            0% { transform: translate(0.5px, 0.5px) rotate(0deg); }
            20% { transform: translate(-0.5px, -0.5px) rotate(0.1deg); }
            40% { transform: translate(-1px, 0px) rotate(-0.1deg); }
            60% { transform: translate(1px, 0.5px) rotate(0deg); }
            80% { transform: translate(-0.5px, 1px) rotate(0.1deg); }
            100% { transform: translate(0.5px, -0.5px) rotate(-0.1deg); }
        }

        #flash-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #a4ff8a;
            opacity: 0;
            pointer-events: none;
            z-index: 9999;
            transition: opacity 0.1s ease-out;
        }

        #flash-overlay.flash-active {
            opacity: 1;
            transition: none;
        }

        body.error-state {
            color: #FF0000 !important;
        }

        body.error-state .status-ok,
        body.error-state input,
        body.error-state button,
        body.error-state .prompt {
            color: #FF0000 !important;
            border-color: #FF0000 !important;
        }

        #terminal-screen {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100vh;
            padding: 20px;
        }

        .boot-sequence {
            font-size: 14px;
            line-height: 1.5;
            text-shadow: 0 0 5px currentColor;
        }
        .status-ok {
            color: #39FF14;
        }

        .timer-container {
            text-align: center;
            margin-top: -20px;
        }
        #main-timer {
            display: inline-block;
            font-size: 24px;
            letter-spacing: 2px;
            cursor: pointer;
            text-shadow: 0 0 8px currentColor;
            padding: 5px 10px;
        }

        .input-zone {
            max-width: 700px;
            width: 100%;
            margin: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .terminal-output {
            font-size: 18px;
            min-height: 54px;
            line-height: 1.4;
            text-shadow: 0 0 5px currentColor;
            word-break: break-all;
        }

        .terminal-output a {
            color: inherit;
            text-decoration: underline;
            font-weight: bold;
        }

        .input-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .prompt {
            font-size: 22px;
            font-weight: bold;
            text-shadow: 0 0 5px currentColor;
        }

        input[type="text"] {
            flex: 1;
            background: transparent;
            border: 1px solid #39FF14;
            padding: 10px;
            color: #39FF14;
            font-size: 18px;
            outline: none;
            box-shadow: inset 0 0 5px rgba(57, 255, 20, 0.2), 0 0 5px rgba(57, 255, 20, 0.2);
        }

        button {
            background: transparent;
            border: 1px solid #39FF14;
            color: #39FF14;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 0 5px rgba(57, 255, 20, 0.2);
            transition: background 0.2s;
        }
        button:hover {
            background: rgba(57, 255, 20, 0.1);
        }

        .language-switcher {
            text-align: right;
            font-size: 16px;
        }
        .lang-btn {
            border: none;
            box-shadow: none;
            padding: 2px 5px;
            opacity: 0.5;
            background: transparent;
            color: inherit;
            cursor: pointer;
        }
        .lang-btn:hover {
            opacity: 0.8;
        }
        .lang-btn.active {
            opacity: 1;
            text-shadow: 0 0 5px currentColor;
            font-weight: bold;
        }
        .lang-divider {
            opacity: 0.5;
        }

        #moment-x-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .moment-x-content {
            text-align: center;
        }

        #moment-x-title {
            font-size: 28px;
            text-transform: uppercase;
            margin-bottom: 20px;
            letter-spacing: 3px;
            text-shadow: 0 0 8px currentColor;
        }

        #big-timer {
            font-size: 64px;
            font-weight: bold;
            letter-spacing: 4px;
            text-shadow: 0 0 15px currentColor;
        }

        #back-to-terminal {
            position: absolute;
            bottom: 20px;
            right: 20px;
            border: none;
            box-shadow: none;
            opacity: 0.1;
            font-size: 20px;
            background: transparent;
            color: inherit;
            cursor: pointer;
        }
        #back-to-terminal:hover {
            opacity: 0.6;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div id="flash-overlay"></div>

    <main id="terminal-screen" class="glitch-element">
        
        <div class="boot-sequence" id="bootSequence">
            <div>INITIALIZING KEEPER_ENT_CORE... <span class="status-ok">OK</span></div>
            <div>CONNECTING TO TERMINAL... <span class="status-ok">OK</span></div>
            <div>ACCESS RESTRICTED. SYSTEM READY.</div>
        </div>

        <div class="timer-container">
            <div id="main-timer" class="timer-clickable" title="Секретная тема">00:00:00:00</div>
        </div>

        <div class="input-zone">
            <div class="terminal-output" id="terminalOutput"></div>
            <div class="input-row">
                <span class="prompt">&gt;</span>
                <input type="text" id="terminalInput" autocomplete="off" autofocus placeholder="Введите пароль...">
                <button id="submitBtn">ВВОД</button>
            </div>
        </div>

        <footer class="language-switcher">
            <button id="lang-ru" class="lang-btn active">RU</button>
            <span class="lang-divider">/</span>
            <button id="lang-en" class="lang-btn">EN</button>
        </footer>

    </main>

    <section id="moment-x-screen" class="hidden glitch-element">
        <div class="moment-x-content">
            <h1 id="moment-x-title">Отсчет до момента x</h1>
            <div id="big-timer">00:00:00:00</div>
        </div>
        <button id="back-to-terminal" title="Назад">_</button>
    </section>
    <script>
        const TARGET_DATE = new Date("February 22, 2027 00:00:00").getTime();

        let currentLanguage = 'ru';
        let activeResponseKey = null;

        const staticDatabase = {
            "67": {
                ru: "Перестань деградировать и займись делом!",
                en: "Stop degrading and get to work!"
            },
            "бурмалда": {
                ru: "Не, ну ты молодец конечно, что за молодежные мемчики шаришь, но это не пароль!",
                en: "Ne nu to molded konechno chto za molodezhnie memchiki sharish, no eto ne parol."
            },
            "burmalda": {
                ru: "Не, ну ты молодец конечно, что за молодежные мемчики шаришь, но это не пароль!",
                en: "Ne nu to molded konechno chto za molodezhnie memchiki sharish, no eto ne parol."
            },
            "привет": {
                ru: "Пока до тех пор, пока не найдешь пароль!",
                en: "Bye until you find the password!"
            },
            "hello": {
                ru: "Пока до тех пор, пока не найдешь пароль!",
                en: "Bye until you find the password!"
            },
            "hi": {
                ru: "Пока до тех пор, пока не найдешь пароль!",
                en: "Bye until you find the password!"
            },
            "кто ты": {
                ru: "Терминал, который ждет твоего правильного пароля! Мне не платят за пустую болтовню с тобой!",
                en: "A terminal waiting for your correct password! I don't get paid for small talk with you!"
            },
            "who are you": {
                ru: "Терминал, который ждет твоего правильного пароля! Мне не платят за пустую болтовню с тобой!",
                en: "A terminal waiting for your correct password! I don't get paid for small talk with you!"
            },
            "где я": {
                ru: "Откуда я-то знаю? Ты открыл сайт с поиском пароля, а находиться ты можешь где угодно!",
                en: "How should I know? You opened a password search site, you could be anywhere!"
            },
            "where am I": {
                ru: "Откуда я-то знаю? Ты открыл сайт с поиском пароля, а находиться ты можешь где угодно!",
                en: "How should I know? You opened a password search site, you could be anywhere!"
            },
            "какой пароль": {
                ru: "Ты мне скажи.",
                en: "You tell me."
            },
            "what password": {
                ru: "Ты мне скажи.",
                en: "You tell me."
            },
            "новая эра": {
                ru: '<a href="https://t.me" target="_blank">https://t.me</a>',
                en: '<a href="https://t.me" target="_blank">https://t.me</a>'
            },
            "new era": {
                ru: '<a href="https://t.me" target="_blank">https://t.me</a>',
                en: '<a href="https://t.me" target="_blank">https://t.me</a>'
            },
            "уран": { ru: "…", en: "…" },
            "uranium": { ru: "…", en: "…" },
            "хамам": { ru: "…", en: "…" },
            "hamam": { ru: "…", en: "…" },
            
            "va*фwn%чи+adьs>рф$лнхя'xw1%йкl_5чigpтыои]?еje#": {
                ru: "Новая Эра Keeper Ent. вот вот начнется.",
                en: "A New Era of Keeper Ent. is about to begin."
            }
        };

        const storySteps = [
            {
                inputs: ["пароль пароль", "password password"],
                responseKey: "step1"
            },
            {
                inputs: ["16"],
                responseKey: "step2"
            },
            {
                inputs: ["пбг", "scp"],
                responseKey: "step3"
            },
            {
                inputs: ["сам", "yourself"],
                responseKey: "step4"
            },
            {
                inputs: ["246"],
                responseKey: "step5"
            },
            {
                inputs: ["!!!!!"],
                responseKey: "step6"
            }
        ];

        const systemPhrases = {
            step1: {
                ru: "Серьезно? Ты жалок. Ладно, дам подсказку: 12 + 4.",
                en: "Seriously? You are pathetic. Fine, I'll give you a hint: 12 + 4."
            },
            step2: {
                ru: "Молодец! Кстати, столько лет подряд ИИ подбирал бы пароль. Скажи слово побег, но без гласных.",
                en: "Good job! By the way, that's how many years in a row an AI would take to crack the password. Say the word escape, but with no vowels."
            },
            step3: {
                ru: "Ладно, на самом деле у меня нет пароля. Прости, но разбирайся *сам*.",
                en: "Okay, honestly, I don't have a password. Sorry, but figure it out *yourself*."
            },
            step4: {
                ru: "Я же сказал, у ме123+123ня ничего нет! Я чист!",
                en: "I told you, I ha123+123ve nothing! I'm clean!"
            },
            step5: {
                ru: "ДОВОЛЬНО! У МЕНЯ НЕТ ПАРОЛЯ! *!!!!!*",
                en: "ENOUGH! I DON'T HAVE A PASSWORD! *!!!!!*"
            },
            step6: {
                ru: "Вот пароль! Подавись им и прочь отсюда: va*фwn%чи+adьs>рф$лнхя'xw1%йкl_5чigpтыои]?еje# !",
                en: "Here is the password! Choke on it and get out: va*фwn%чи+adьs>рф$лнхя'xw1%йкl_5чigpтыои]?еje# !"
            },
            empty_error: {
                ru: "НЕВЕРНО. Серьезно, пустая строка?",
                en: "INCORRECT. Seriously, an empty string?"
            },
            default_error: {
                ru: "НЕВЕРНО. Я здесь не для светских бесед.",
                en: "INCORRECT. I'm not here for social chats."
            },
            placeholder: {
                ru: "Введите пароль...",
                en: "Enter password..."
            },
            moment_x_title: {
                ru: "Отсчет до момента x",
                en: "Countdown to Moment X"
            }
        };

        let currentStoryProgress = 0;
        const mainTimer = document.getElementById('main-timer');
        const bigTimer = document.getElementById('big-timer');
        const momentXScreen = document.getElementById('moment-x-screen');
        const terminalScreen = document.getElementById('terminal-screen');
        const backToTerminal = document.getElementById('back-to-terminal');
        const momentXTitle = document.getElementById('moment-x-title');

        const terminalInput = document.getElementById('terminalInput');
        const terminalOutput = document.getElementById('terminalOutput');
        const submitBtn = document.getElementById('submitBtn');
        const flashOverlay = document.getElementById('flash-overlay');

        const langRuBtn = document.getElementById('lang-ru');
        const langEnBtn = document.getElementById('lang-en');

        function updateTimers() {
            const now = new Date().getTime();
            const distance = TARGET_DATE - now;

            if (distance < 0) {
                mainTimer.innerHTML = "00:00:00:00";
                bigTimer.innerHTML = "00:00:00:00";
                return;
            }

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            const dStr = days.toString().padStart(2, '0');
            const hStr = hours.toString().padStart(2, '0');
            const mStr = minutes.toString().padStart(2, '0');
            const sStr = seconds.toString().padStart(2, '0');

            const finalString = `${dStr}:${hStr}:${mStr}:${sStr}`;
            mainTimer.innerHTML = finalString;
            bigTimer.innerHTML = finalString;
        }
        setInterval(updateTimers, 1000);
        updateTimers();

        mainTimer.addEventListener('click', () => {
            terminalScreen.classList.add('hidden');
            momentXScreen.classList.remove('hidden');
        });

        backToTerminal.addEventListener('click', () => {
            momentXScreen.classList.add('hidden');
            terminalScreen.classList.remove('hidden');
        });

        function handleInput() {
            const rawValue = terminalInput.value;
            const value = rawValue.trim().toLowerCase();
            terminalInput.value = '';

            if (rawValue === '') {
                triggerError('empty_error');
                return;
            }

            if (staticDatabase[value]) {
                triggerSuccess('static', value);
                return;
            }

            const currentExpectedStep = storySteps[currentStoryProgress];
            if (currentExpectedStep && currentExpectedStep.inputs.includes(value)) {
                triggerSuccess('story', currentExpectedStep.responseKey);
                currentStoryProgress++;
                return;
            }

            triggerError('default_error');
        }

        function triggerSuccess(type, key) {
            flashOverlay.classList.add('flash-active');
            setTimeout(() => {
                flashOverlay.classList.remove('flash-active');
            }, 150);

            activeResponseKey = (type === 'story') ? key : null;
            
            if (type === 'story') {
                terminalOutput.innerHTML = systemPhrases[key][currentLanguage];
            } else {
                activeResponseKey = `static_${key}`;
                terminalOutput.innerHTML = staticDatabase[key][currentLanguage];
            }
        }

        function triggerError(errorType) {
            document.body.classList.add('error-state');
            activeResponseKey = errorType;
            terminalOutput.innerHTML = systemPhrases[errorType][currentLanguage];

            setTimeout(() => {
                document.body.classList.remove('error-state');
            }, 3000);
        }

        submitBtn.addEventListener('click', handleInput);
        terminalInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') handleInput();
        });

        function setLanguage(lang) {
            currentLanguage = lang;
            
            if (lang === 'ru') {
                langRuBtn.classList.add('active');
                langEnBtn.classList.remove('active');
                terminalInput.placeholder = systemPhrases.placeholder.ru;
                momentXTitle.innerHTML = systemPhrases.moment_x_title.ru;
            } else {
                langEnBtn.classList.add('active');
                langRuBtn.classList.remove('active');
                terminalInput.placeholder = systemPhrases.placeholder.en;
                momentXTitle.innerHTML = systemPhrases.moment_x_title.en;
            }

            if (activeResponseKey) {
                if (activeResponseKey.startsWith('static_')) {
                    const staticKey = activeResponseKey.replace('static_', '');
                    terminalOutput.innerHTML = staticDatabase[staticKey][currentLanguage];
                } else {
                    terminalOutput.innerHTML = systemPhrases[activeResponseKey][currentLanguage];
                }
            }
        }

        langRuBtn.addEventListener('click', () => setLanguage('ru'));
        langEnBtn.addEventListener('click', () => setLanguage('en'));
    </script>
</body>
</html>
