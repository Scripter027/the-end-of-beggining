<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The End of Beginnings</title>
<style>
@import url('https://googleapis.com');
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #000; color: #0f0; font-family: 'Share+Tech+Mono', monospace; height: 100vh; overflow: hidden; position: relative; }
body::after { content: " "; display: block; position: absolute; top: 0; left: 0; bottom: 0; right: 0; background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06)); z-index: 999; background-size: 100% 4px, 6px 100%; pointer-events: none; }
.glare { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle, rgba(0,30,0,0.15) 0%, rgba(0,0,0,0) 80%); pointer-events: none; z-index: 998; }
#boot-screen { position: absolute; width: 100%; height: 100%; background: #000; padding: 20px; overflow: hidden; z-index: 10; font-size: 14px; line-height: 1.4; white-space: pre-wrap; }
#main-screen { display: none; height: 100vh; flex-direction: column; justify-content: space-between; padding: 20px; position: relative; transition: background 0.1s ease; }
.correct-flash { animation: flash-green 0.4s ease-out; }
.wrong-flash { animation: flash-red 0.5s ease-out; }
@keyframes flash-green { 0% { background: #4f4; color: #000; } 10% { background: #4f4; } 100% { background: #000; } }
@keyframes flash-red { 0% { background: #f00; color: #fff; } 10% { background: #f00; } 100% { background: #000; } }
header { display: flex; justify-content: center; align-items: center; position: relative; height: 60px; }
#timer-container { cursor: pointer; text-align: center; border: 1px solid #0f0; padding: 8px 20px; background: rgba(0,20,0,0.4); text-transform: uppercase; letter-spacing: 2px; font-size: 18px; box-shadow: 0 0 10px rgba(0,255,0,0.2); }
#timer-container:hover { background: #0f0; color: #000; }
.center-container { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 20px; }
#terminal-output { width: 100%; max-width: 600px; text-align: center; min-height: 40px; font-size: 20px; letter-spacing: 1px; word-break: break-word; }
.input-panel { display: flex; align-items: center; gap: 10px; width: 100%; max-width: 500px; background: rgba(0,10,0,0.5); border: 1px solid #0f0; padding: 5px 10px; box-shadow: 0 0 15px rgba(0,255,0,0.1); }
.input-panel input { flex: 1; background: transparent; border: none; outline: none; color: #0f0; font-family: 'Share+Tech+Mono', monospace; font-size: 22px; padding: 5px; text-transform: uppercase; }
.input-panel button { background: #0f0; color: #000; border: none; font-family: 'Share+Tech+Mono', monospace; font-size: 18px; font-weight: bold; padding: 8px 20px; cursor: pointer; text-transform: uppercase; }
.input-panel button:hover { background: #0a0; }
footer { display: flex; justify-content: flex-end; align-items: center; padding: 10px 0; }
#lang-toggle { cursor: pointer; border: 1px solid #0f0; padding: 4px 10px; font-size: 14px; background: transparent; color: #0f0; font-family: 'Share+Tech+Mono', monospace; }
#lang-toggle:hover { background: #0f0; color: #000; }
#secret-screen { display: none; height: 100vh; flex-direction: column; justify-content: center; align-items: center; background: #000; color: #0f0; padding: 20px; text-align: center; position: relative; }
#secret-title { font-size: 28px; letter-spacing: 4px; margin-bottom: 30px; text-transform: uppercase; animation: pulse 2s infinite; }
#secret-timer { font-size: 48px; font-weight: bold; letter-spacing: 3px; border: 2px solid #0f0; padding: 20px 40px; background: rgba(0,15,0,0.3); box-shadow: 0 0 25px rgba(0,255,0,0.3); }
#back-btn { margin-top: 40px; border: 1px solid #0f0; background: transparent; color: #0f0; font-family: 'Share+Tech+Mono', monospace; font-size: 16px; padding: 8px 20px; cursor: pointer; text-transform: uppercase; }
#back-btn:hover { background: #0f0; color: #000; }
@keyframes pulse { 0% { opacity: 0.7; } 50% { opacity: 1; text-shadow: 0 0 15px #0f0; } 100% { opacity: 0.7; } }
.red-ui { color: #f00 !important; border-color: #f00 !important; box-shadow: 0 0 15px rgba(255,0,0,0.2) !important; }
.red-ui input { color: #f00 !important; }
.red-ui button { background: #f00 !important; color: #000 !important; }
</style>
</head>
<body>
<div class="glare"></div>
<div id="boot-screen"></div>

<div id="main-screen">
  <header>
    <div id="timer-container" onclick="openSecret()">00:00:00:00</div>
  </header>

  <div class="center-container">
    <div id="terminal-output"></div>
    <div class="input-panel" id="panel-box">
      <input type="text" id="terminal-input" autocomplete="off" autofocus>
      <button id="submit-btn" onclick="processInput()"></button>
    </div>
  </div>

  <footer>
    <button id="lang-toggle" onclick="toggleLang()">EN</button>
  </footer>
</div>

<div id="secret-screen">
  <div id="secret-title"></div>
  <div id="secret-timer">00:00:00:00</div>
  <button id="back-btn" onclick="closeSecret()"></button>
</div>
<script>
const targetDate = new Date('2027-02-22T00:00:00').getTime();
let currentLang = 'RU';

const bootLines = [
  "CORE::INIT -> LAUNCHING TERMINAL SUBSYSTEM",
  "LOADING CORE MODULES.......................[OK]",
  "ESTABLISHING SECURE PROTOCOLS...............[OK]",
  "DECRYPTING KEEPER NETWORKS..................[OK]",
  "WARNING: CHANNELS ARE UNSTABLE",
  "IDENTITY VERIFICATION REJECTED. ANONYMOUS STATUS ASSIGNED.",
  "SYSTEM IS READY. DO NOT WASTE MY TIME."
];

const localization = {
  RU: {
    submit: "ВВОД",
    secretTitle: "Отсчет до момента x",
    back: "Назад",
    wrong: "НЕПРАВИЛЬНО",
    init: "Ну. Чего тебе?",
    empty: "Пустую строку кидаешь? Издеваешься?",
    era: "Новая Эра Keeper Ent. вот вот начнется.",
    scolded: [
      "Мимо. Еще раз подумай.",
      "Слабо. Очень слабо.",
      "И это всё, на что ты способен?",
      "Не угадал. Твоя логика пуста.",
      "Прекрати перебирать мусор.",
      "Неверно. Система видит твою растерянность."
    ]
  },
  EN: {
    submit: "ENTER",
    secretTitle: "Countdown to moment x",
    back: "Back",
    wrong: "WRONG",
    init: "Well. What do you want?",
    empty: "An empty string? Are you mocking me?",
    era: "The New Era of Keeper Ent. is about to begin.",
    scolded: [
      "Missed. Think again.",
      "Weak. Pathetic.",
      "Is that all you can do?",
      "Wrong guess. Your logic is empty.",
      "Stop entering garbage.",
      "Incorrect. The system sees your confusion."
    ]
  }
};

function runBootSequence() {
  const container = document.getElementById('boot-screen');
  let lineIdx = 0;
  function addLine() {
    if (lineIdx < bootLines.length) {
      container.innerHTML += bootLines[lineIdx] + "\n";
      lineIdx++;
      setTimeout(addLine, Math.random() * 250 + 100);
    } else {
      setTimeout(() => {
        container.style.display = 'none';
        document.getElementById('main-screen').style.display = 'flex';
        updateUI();
        document.getElementById('terminal-output').innerText = localization[currentLang].init;
      }, 600);
    }
  }
  addLine();
}

function updateTimers() {
  const now = new Date().getTime();
  const diff = targetDate - now;
  if (diff <= 0) {
    document.getElementById('timer-container').innerText = "00:00:00:00";
    document.getElementById('secret-timer').innerText = "00:00:00:00";
    return;
  }
  const days = Math.floor(diff / (1000 * 60 * 60 * 24));
  const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
  const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
  const seconds = Math.floor((diff % (1000 * 60)) / 1000);
  const pad = (num) => String(num).padStart(2, '0');
  const timerStr = pad(days) + ":" + pad(hours) + ":" + pad(minutes) + ":" + pad(seconds);
  document.getElementById('timer-container').innerText = timerStr;
  document.getElementById('secret-timer').innerText = timerStr;
}

function toggleLang() {
  currentLang = currentLang === 'RU' ? 'EN' : 'RU';
  document.getElementById('lang-toggle').innerText = currentLang === 'RU' ? 'EN' : 'RU';
  updateUI();
  document.getElementById('terminal-output').innerText = localization[currentLang].init;
}

function updateUI() {
  document.getElementById('submit-btn').innerText = localization[currentLang].submit;
  document.getElementById('secret-title').innerText = localization[currentLang].secretTitle;
  document.getElementById('back-btn').innerText = localization[currentLang].back;
}

function openSecret() {
  document.getElementById('main-screen').style.display = 'none';
  document.getElementById('secret-screen').style.display = 'flex';
}

function closeSecret() {
  document.getElementById('secret-screen').style.display = 'none';
  document.getElementById('main-screen').style.display = 'flex';
}

function processInput() {
  const inputEl = document.getElementById('terminal-input');
  const outputEl = document.getElementById('terminal-output');
  const mainScreen = document.getElementById('main-screen');
  const panelBox = document.getElementById('panel-box');
  const rawVal = inputEl.value.trim();
  
  mainScreen.classList.remove('correct-flash', 'wrong-flash');
  panelBox.classList.remove('red-ui');
  outputEl.style.color = '#0f0';
  
  if (!rawVal) {
    outputEl.innerText = localization[currentLang].empty;
    return;
  }
  
  const superSecretHash = "KEEPER_404_99_OMEGA_INIT_2027";
  
  if (rawVal.toUpperCase() === superSecretHash) {
    void mainScreen.offsetWidth;
    mainScreen.classList.add('correct-flash');
    outputEl.innerText = localization[currentLang].era;
    inputEl.value = '';
  } else {
    void mainScreen.offsetWidth;
    mainScreen.classList.add('wrong-flash');
    panelBox.classList.add('red-ui');
    outputEl.style.color = '#f00';
    const lines = localization[currentLang].scolded;
    const randomLine = lines[Math.floor(Math.random() * lines.length)];
    outputEl.innerText = localization[currentLang].wrong + ". " + randomLine;
  }
}

document.getElementById('terminal-input').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') {
    processInput();
  }
});

setInterval(updateTimers, 1000);
updateTimers();
window.onload = runBootSequence;
</script>
</body>
</html>
