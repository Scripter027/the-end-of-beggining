<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>The End of Beginnings</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
        }

        body {
            color: #00ff00;
            font-family: monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            transition: color 1s ease;
        }

        body.error-alert {
            color: #ff0000 !important;
            transition: none !important;
        }

        body.error-alert .box {
            border-color: #ff0000 !important;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.5) !important;
            transition: none !important;
        }

        body.error-alert input {
            border-color: #ff0000 !important;
            color: #ff0000 !important;
            transition: none !important;
        }

        body.error-alert button.submit-btn {
            background-color: #ff0000 !important;
            transition: none !important;
        }

        body.error-alert .lang-menu, body.error-alert .timer-link {
            border-color: #ff0000 !important;
            color: #ff0000 !important;
            transition: none !important;
        }

        .box {
            border: 2px solid #00ff00;
            padding: 40px;
            display: inline-block;
            border-radius: 10px;
            background-color: #050505;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.3);
            transition: all 1s ease; 
        }

        .lang-menu {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #000;
            border: 1px solid #00ff00;
            color: #00ff00;
            padding: 8px 12px;
            font-family: monospace;
            font-size: 14px;
            z-index: 9999;
            outline: none;
            cursor: pointer;
            transition: all 1s ease;
        }

        .lang-menu option {
            background: #000;
            color: #00ff00;
        }

        .timer-link {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: transparent;
            border: 1px dashed #00ff00;
            color: #00ff00;
            padding: 8px 15px;
            text-decoration: none;
            font-family: monospace;
            font-size: 16px;
            cursor: pointer;
            z-index: 9999;
            transition: border 1s ease, color 1s ease, background 0.2s;
        }

        .timer-link:hover {
            background: rgba(0, 255, 0, 0.1);
            border-style: solid;
        }

        .input-container {
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        input {
            background: #111;
            border: 1px solid #00ff00;
            color: #00ff00;
            padding: 10px;
            font-family: monospace;
            font-size: 18px;
            outline: none;
            transition: all 1s ease;
        }

        button.submit-btn {
            background: #00ff00;
            color: #000;
            padding: 10px 20px;
            font-weight: bold;
            border: none;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 1s ease;
        }

        button.submit-btn:hover {
            background: #00cc00;
        }

        #text {
            margin-bottom: 25px;
            font-size: 20px;
            min-height: 50px;
            max-width: 400px;
            line-height: 1.4;
            white-space: pre-line;
            text-shadow: 0 0 5px rgba(0, 255, 0, 0.5);
            animation: tv-text-glitch 0.4s infinite;
        }

        body.error-alert #text {
            text-shadow: 0 0 7px rgba(255, 0, 0, 0.7);
            animation: tv-text-glitch-heavy 0.2s infinite;
        }

        @keyframes tv-text-glitch {
            0% { transform: translate(0, 0) skew(0deg); opacity: 0.98; }
            15% { transform: translate(-0.5px, 0.2px) skew(0.1deg); }
            30% { transform: translate(0.5px, -0.2px) skew(-0.1deg); opacity: 1; }
            45% { transform: translate(-0.2px, -0.5px) skew(0deg); }
            60% { transform: translate(0.3px, 0.3px) skew(0.05deg); opacity: 0.95; }
            75% { transform: translate(-0.5px, -0.1px) skew(-0.05deg); }
            90% { transform: translate(0.2px, 0.5px) skew(0deg); opacity: 1; }
            100% { transform: translate(0, 0) skew(0deg); }
        }

        @keyframes tv-text-glitch-heavy {
            0% { transform: translate(0, 0) scale(1) skew(0deg); opacity: 0.9; }
            20% { transform: translate(-2px, 0.5px) scale(0.99) skew(-0.4deg); }
            40% { transform: translate(1.5px, -1px) scale(1.01) skew(0.3deg); opacity: 1; }
            60% { transform: translate(-1px, 1.5px) scale(1) skew(-0.2deg); }
            80% { transform: translate(2px, -0.5px) scale(0.995) skew(0.4deg); opacity: 0.95; }
            100% { transform: translate(0, 0) scale(1) skew(0deg); }
        }
    </style>
</head>
<body>
    <div class="box">
        <div id="text"></div>

        <div class="input-container" id="inputContainer">
            <input type="text" id="userAnswer" placeholder="" autocomplete="off">
            <button class="submit-btn" id="submitBtn" onclick="checkCode()">ВВОД</button>
        </div>
    </div>

    <a href="https://scripter027.github.io/the-archive-027/" target="_blank" class="timer-link" id="countdownTimer">00d 00h 00m 00s</a>

    <select class="lang-menu" id="langSelect" onchange="changeLanguage(this.value)">
        <option value="ru">Русский</option>
        <option value="en">English</option>
    </select>
    <script>
        var targetDate = new Date(2027, 1, 22, 15, 30, 00).getTime();
        var alertTimeout = null;

        var interfaceUi = {
            ru: { btn: "ВВОД", placeholder: "Ваш ответ..." },
            en: { btn: "ENTER", placeholder: "Your answer..." }
        };

        var currentLang = "ru";
        var currentText = "";

        var startTexts = {
            ru: "Введите Пароль",
            en: "Enter Password"
        };

        var wrongTexts = {
            ru: "НЕВЕРНО",
            en: "WRONG"
        };

        var gameLevels = [
            {
                passwords: ["что это за место", "what is this place"],
                ru: "Не важно, важно то, что ты здесь забыл! А что именно ты тут забыл - без понятия.",
                en: "It doesn't matter, what matters is that you're here! And what exactly you're here forgot – I have no idea."
            },
            {
                passwords: ["пароль", "password"],
                ru: "Таких глупых мы еще не встречали. Ты правда думаешь, что этот секрет можно узнать, всего лишь написав *Пароль*?",
                en: "We've never met such stupid people. Do you really think this secret can be found out just by typing *Password*?"
            },
            {
                passwords: ["кто ты", "who are you"],
                ru: "Терминал, отвечающий на твои глупые вопросы, в надежде на то, что ты найдешь его!",
                en: "A terminal that answers your stupid questions, in the hope that you'll find it!"
            },
            {
                passwords: ["а какой пароль", "what is the password"],
                ru: "Ты мне скажи.",
                en: "You tell me."
            },
            {
                passwords: ["keeper entertainment", "keeper entertainment"],
                ru: "Новая Эра Грядет.",
                en: "A New Era is Coming."
            },
            {
                passwords: ["новая эра", "new era"],
                ru: "Новая Эра Грядет.",
                en: "A New Era is Coming."
            },
            {
                passwords: ["финал", "final"],
                ru: "Поздравляю! Ты прошел ARG до самого конца. Секретов больше нет.",
                en: "Congratulations! You completed the ARG. No more secrets."
            }
        ];

        function updateDisplay() {
            var screen = document.getElementById("text");
            var inputField = document.getElementById("userAnswer");
            var submitBtn = document.getElementById("submitBtn");

            if (submitBtn) { submitBtn.innerText = interfaceUi[currentLang].btn; }
            if (inputField) { inputField.placeholder = interfaceUi[currentLang].placeholder; }

            if (screen) {
                if (currentText === "") {
                    screen.innerText = startTexts[currentLang];
                } else {
                    screen.innerText = currentText;
                }
            }
        }

        function changeLanguage(langCode) {
            currentLang = langCode;

            if (currentText === startTexts['ru'] || currentText === startTexts['en'] || currentText === "") {
                currentText = startTexts[currentLang];
            } else if (currentText === wrongTexts['ru'] || currentText === wrongTexts['en']) {
                currentText = wrongTexts[currentLang];
            } else {
                var screen = document.getElementById("text");
                if (screen) {
                    for (var i = 0; i < gameLevels.length; i++) {
                        if (screen.innerText === gameLevels[i]['ru'] || screen.innerText === gameLevels[i]['en']) {
                            currentText = gameLevels[i][currentLang];
                            break;
                        }
                    }
                }
            }
            updateDisplay();
        }

        function checkCode() {
            var inputField = document.getElementById("userAnswer");
            if (!inputField) return;

            var input = inputField.value.toLowerCase().trim();
            var found = false;

            if (alertTimeout) {
                clearTimeout(alertTimeout);
            }

            for (var i = 0; i < gameLevels.length; i++) {
                if (gameLevels[i].passwords.includes(input)) {
                    currentText = gameLevels[i][currentLang];
                    found = true;
                    document.body.classList.remove("error-alert");
                    break;
                }
            }

            if (!found) {
                currentText = wrongTexts[currentLang];
                document.body.classList.add("error-alert");

                alertTimeout = setTimeout(function() {
                    document.body.classList.remove("error-alert");
                }, 5000);
            }

            inputField.value = "";
            updateDisplay();
        }

        window.onload = function () {
            var timerElement = document.getElementById("countdownTimer");

            var inputField = document.getElementById("userAnswer");
            if (inputField) {
                inputField.addEventListener("keypress", function(event) {
                    if (event.key === "Enter") {
                        checkCode();
                    }
                });
            }

            var timerInterval = setInterval(function () {
                var now = new Date().getTime();
                var distance = targetDate - now;

                var days = Math.floor(distance / (1000 * 60 * 60 * 24));
                var hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                var minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                var seconds = Math.floor((distance % (1000 * 60)) / 1000);

                days = days < 10 ? "0" + days : days;
                hours = hours < 10 ? "0" + hours : hours;
                minutes = minutes < 10 ? "0" + minutes : minutes;
                seconds = seconds < 10 ? "0" + seconds : seconds;

                if (timerElement) {
                    if (distance > 0) {
                        timerElement.innerText = days + "d " + hours + "h " + minutes + "m " + seconds + "s";
                    } else {
                        clearInterval(timerInterval);
                        timerElement.innerText = currentLang === "ru" ? "[ВРЕМЯ ИСТЕКЛО]" : "[TIME IS UP]";
                    }
                }
            }, 1000);

            updateDisplay();
        };
    </script>
</body>
</html>
