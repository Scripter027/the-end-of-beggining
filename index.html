<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The End of Beginnings</title>
    <style>
        :root {
            --neon-green: #33ff33;
            --dark-green: #002200;
            --bright-green: #88ff88;
            --neon-red: #ff3333;
            --dark-red: #220000;
            --glow: 0 0 10px rgba(51, 255, 51, 0.4);
            --glass-glare: radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.05) 0%, rgba(255, 255, 255, 0.02) 40%, rgba(0, 0, 0, 0.4) 100%);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body, html {
            background-color: #020802;
            color: var(--neon-green);
            font-family: 'Courier New', Courier, monospace;
            height: 100%;
            width: 100%;
            overflow: hidden;
            position: relative;
        }

        /* Полноэкранный аналоговый фильтр: линии + блик по всему монитору */
        body::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: 
                linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.35) 50%), 
                var(--glass-glare);
            z-index: 999;
            background-size: 100% 4px, 100% 100%;
            pointer-events: none;
            transition: background 0.3s ease;
        }

        /* Красный режим при ошибке: блики остаются, но меняют цвет */
        body.wrong-flash {
            background-color: #0a0101 !important;
            color: var(--neon-red) !important;
        }
        body.wrong-flash::before {
            background: 
                linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.45) 50%), 
                radial-gradient(circle at 50% 50%, rgba(255, 50, 50, 0.08) 0%, rgba(255, 50, 50, 0.02) 50%, rgba(0, 0, 0, 0.6) 100%) !important;
            background-size: 100% 4px, 100% 100%;
        }
        
        body.wrong-flash .terminal-input, 
        body.wrong-flash .btn-submit,
        body.wrong-flash .timer-wrapper {
            border-color: var(--neon-red) !important;
            color: var(--neon-red) !important;
            box-shadow: 0 0 10px rgba(255, 51, 51, 0.3) !important;
            text-shadow: 0 0 5px var(--neon-red) !important;
        }
        body.wrong-flash .lang-switch, body.wrong-flash .terminal-output {
            color: var(--neon-red) !important;
            text-shadow: 0 0 5px var(--neon-red) !important;
        }

        /* Зеленый финал */
        body.correct-flash {
            background-color: var(--bright-green) !important;
            color: #000 !important;
        }
        body.correct-flash * {
            text-shadow: none !important;
            color: #000 !important;
            border-color: #000 !important;
        }

        .glow-text {
            text-shadow: var(--glow);
        }

        #boot-screen {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 14px;
            line-height: 1.5;
            z-index: 10;
            text-shadow: var(--glow);
        }

        #main-container {
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            width: 100%;
            padding: 20px;
            position: relative;
            z-index: 5;
        }

        /* Прямоугольная обводка таймера */
        .timer-wrapper {
            position: absolute;
            top: 6%;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            cursor: pointer;
            padding: 10px 20px;
            border: 2px solid var(--neon-green);
            box-shadow: var(--glow);
            background: rgba(0, 15, 0, 0.2);
            min-width: 240px;
            transition: all 0.3s ease;
        }

        .timer-title {
            font-size: 11px;
            margin-bottom: 5px;
            letter-spacing: 1px;
            text-transform: uppercase;
            display: none; /* Скрыто изначально */
        }

        .timer {
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        /* Изменения в секретном режиме */
        .secret-active .timer-title {
            display: block; /* Появляется при клике */
        }
        .secret-active .timer {
            font-size: 32px;
        }

        /* Контейнер терминала по центру */
        .terminal-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 550px;
            padding: 10px;
            margin-top: 60px;
        }

        .terminal-output {
            min-height: 80px;
            margin-bottom: 25px;
            text-align: center;
            font-size: 18px;
            width: 100%;
            word-wrap: break-word;
            line-height: 1.5;
            text-transform: uppercase;
        }

        .input-group {
            display: flex;
            width: 100%;
            gap: 10px;
        }

        .terminal-input {
            flex: 1;
            background: rgba(0, 20, 0, 0.3);
            border: 2px solid var(--neon-green);
            padding: 14px;
            color: var(--neon-green);
            font-family: inherit;
            font-size: 16px;
            outline: none;
            box-shadow: inset 0 0 5px rgba(0,255,0,0.1), var(--glow);
            border-radius: 0;
            text-shadow: var(--glow);
            -webkit-appearance: none;
        }

        .btn-submit {
            background: transparent;
            border: 2px solid var(--neon-green);
            color: var(--neon-green);
            padding: 14px 24px;
            font-family: inherit;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            outline: none;
            box-shadow: var(--glow);
            transition: all 0.1s ease;
            border-radius: 0;
            text-shadow: var(--glow);
        }

        .btn-submit:hover {
            background: var(--neon-green);
            color: #000;
            text-shadow: none;
        }

        .lang-switch {
            position: absolute;
            bottom: 20px;
            right: 20px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            opacity: 0.6;
            padding: 5px 10px;
        }

        /* Полная адаптивность: Мобильные, Планшеты, Мониторы */
        @media (max-width: 768px) {
            .timer-wrapper { min-width: 220px; padding: 8px 15px; }
            .timer { font-size: 22px; }
            .secret-active .timer { font-size: 28px; }
            .terminal-output { font-size: 17px; }
        }

        @media (max-width: 480px) {
            #main-container { padding: 10px; }
            .timer-wrapper { top: 4%; width: 85%; min-width: 0; }
            .timer { font-size: 19px; }
            .secret-active .timer { font-size: 22px; }
            .terminal-box { margin-top: 80px; }
            .terminal-output { font-size: 15px; min-height: 90px; }
            .input-group { flex-direction: column; gap: 8px; }
            .btn-submit { width: 100%; padding: 12px; }
            .terminal-input { padding: 12px; font-size: 15px; }
        }
    </style>
</head>
<body class="glow-text">

    <div id="boot-screen"></div>

    <div id="main-container">
        <div class="timer-wrapper" id="timer-toggle">
            <div class="timer-title" id="timer-label">До момента x осталось:</div>
            <div class="timer" id="countdown">00:00:00:00</div>
        </div>

        <div class="terminal-box">
            <div class="terminal-output" id="response-text">ВВЕДИТЕ ПАРОЛЬ</div>
            <div class="input-group">
                <input type="text" id="user-input" class="terminal-input" autofocus autocomplete="off" placeholder="> ">
                <button id="submit-btn" class="btn-submit">ВВОД</button>
            </div>
        </div>

        <div class="lang-switch" id="lang-btn">EN</div>
    </div>
    <script>
        const targetDate = new Date('2027-02-22T00:00:00').getTime();
        let currentLang = 'ru';
        let isSecretMode = false;
        let isLock = false;
        let currentStep = 0; 

        const langData = {
            ru: {
                boot: ["ИНИЦИАЛИЗАЦИЯ СИСТЕМЫ...", "ПОДКЛЮЧЕНИЕ К KEEPER ENT... OK"],
                labelSecret: "До момента x осталось:",
                wrong: "НЕПРАВИЛЬНО",
                defaultPrompt: "ВВЕДИТЕ ПАРОЛЬ",
                steps: {
                    0: { reply: "Серьезно? Ты жалок. Ладно дам подсказку - 12 + 4." },
                    1: { reply: "Молодец! Кстати столько лет подряд ИИ подбирал бы пароль. Скажи слово побег но без о и е" },
                    2: { reply: "ладно на самом деле у меня нет пароля. Прости, но разбирайся *сам*" },
                    3: { reply: "я же сказал у ме123+123ня ничего нет! Я чист!" },
                    4: { reply: "ДОВОЛЬНО! У МЕНЯ НЕТ ПАРОЛЯ! *!!!!!*" },
                    5: { reply: "Вот пароль! Подавись им и прочь отсюда: va*фwn%чи+adьs>рф\$лнхя'xw1%йкl_5чigpтыои]?еje# !" },
                    6: { reply: "Новая Эра Keeper Ent. вот вот начнется." }
                }
            },
            en: {
                boot: ["SYSTEM INITIALIZATION...", "CONNECTING TO KEEPER ENT... OK"],
                labelSecret: "Until moment x left:",
                wrong: "WRONG",
                defaultPrompt: "ENTER PASSWORD",
                steps: {
                    0: { reply: "Seriously? You are pathetic. Fine, I'll give you a hint - 12 + 4." },
                    1: { reply: "Well done! By the way, that's how many years in a row an AI would brute-force the password. Say the word 'escape' but without vowels" },
                    2: { reply: "fine, the truth is I don't have a password. Sorry, but deal with it *yourself*" },
                    3: { reply: "I ha123+123ve nothing, I told you! I am clean!" },
                    4: { reply: "ENOUGH! I DON'T HAVE A PASSWORD! *!!!!!*" },
                    5: { reply: "Here is the password! Choke on it and get out: va*фwn%чи+adьs>рф\$лнхя'xw1%йкl_5чigpтыои]?еje# !" },
                    6: { reply: "A New Era of Keeper Ent. is about to begin." }
                }
            }
        };

        const stepTriggers = {
            0: ["ПАРОЛЬ", "PASSWORD"],
            1: ["16"],
            2: ["ПБГ", "ESCAP"],
            3: ["САМ", "YOURSELF"],
            4: ["246"],
            5: ["!!!!!"],
            6: ["VA*ФWN%ЧИ+ADЬS>РФ\$ЛНХЯ'XW1%ЙКL_5ЧIGPТЫОИ]?ЕJE#"]
        };

        // Загрузка
        const bootScreen = document.getElementById('boot-screen');
        const mainContainer = document.getElementById('main-container');
        let bootLine = 0;

        function printBootLines() {
            if (bootLine < langData[currentLang].boot.length) {
                bootScreen.innerHTML += langData[currentLang].boot[bootLine] + '<br>';
                bootLine++;
                setTimeout(printBootLines, 300);
            } else {
                setTimeout(() => {
                    bootScreen.style.display = 'none';
                    mainContainer.style.display = 'flex';
                    document.getElementById('user-input').focus();
                }, 400);
            }
        }
        printBootLines();

        // Таймер
        function updateTimer() {
            const distance = targetDate - new Date().getTime();
            if (distance < 0) {
                document.getElementById('countdown').innerHTML = "00:00:00:00";
                return;
            }
            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById('countdown').innerHTML = 
                `${days < 10 ? '0'+days : days}:${hours < 10 ? '0'+hours : hours}:${minutes < 10 ? '0'+minutes : minutes}:${seconds < 10 ? '0'+seconds : seconds}`;
        }
        setInterval(updateTimer, 1000);
        updateTimer();

        // Логика клика на таймер (Смена режима)
        document.getElementById('timer-toggle').addEventListener('click', () => {
            isSecretMode = !isSecretMode;
            mainContainer.classList.toggle('secret-active', isSecretMode);
            document.getElementById('timer-label').innerText = langData[currentLang].labelSecret;
        });

        // Смена языка
        document.getElementById('lang-btn').addEventListener('click', () => {
            currentLang = currentLang === 'ru' ? 'en' : 'ru';
            document.getElementById('lang-btn').innerText = currentLang === 'ru' ? 'EN' : 'RU';
            document.getElementById('timer-label').innerText = langData[currentLang].labelSecret;
            
            if (!isLock) {
                const outputField = document.getElementById('response-text');
                if (outputField.innerText === langData.ru.defaultPrompt || outputField.innerText === langData.en.defaultPrompt) {
                    outputField.innerText = langData[currentLang].defaultPrompt;
                } else if (currentStep > 0) {
                    outputField.innerText = langData[currentLang].steps[currentStep - 1].reply;
                }
            }
        });

        // Валидация ответов
        function checkCode() {
            if (isLock) return;
            const inputField = document.getElementById('user-input');
            const outputField = document.getElementById('response-text');
            const cleanCode = inputField.value.trim().toUpperCase();
            
            if (cleanCode === "") return;

            const expectedTriggers = stepTriggers[currentStep];
            const isCorrect = expectedTriggers.some(trigger => cleanCode === trigger || cleanCode.includes(trigger));

            if (isCorrect) {
                const stepReply = langData[currentLang].steps[currentStep].reply;
                outputField.innerText = stepReply;
                
                if (currentStep === 6) {
                    isLock = true;
                    document.body.classList.add('correct-flash');
                    setTimeout(() => document.body.classList.remove('correct-flash'), 600);
                } else {
                    currentStep++;
                }
                inputField.value = "";
            } else {
                isLock = true;
                outputField.innerText = langData[currentLang].wrong;
                document.body.classList.add('wrong-flash');
                inputField.value = "";

                setTimeout(() => {
                    document.body.classList.remove('wrong-flash');
                    outputField.innerText = langData[currentLang].defaultPrompt;
                    isLock = false;
                    inputField.focus();
                }, 3000); 
            }
        }

        document.getElementById('submit-btn').addEventListener('click', checkCode);
        document.getElementById('user-input').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') checkCode();
        });
    </script>
</body>
</html>
