<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>The End of Beginnings</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000 !important;
            overflow: hidden;
        }

        body {
            color: #00ff00;
            font-family: monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            transition: color 1s ease;
        }

        body.error-alert {
            color: #ff0000 !important;
            transition: none !important;
        }

        body.error-alert .box {
            border-color: #ff0000 !important;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.5) !important;
            transition: none !important;
        }

        body.error-alert input {
            border-color: #ff0000 !important;
            color: #ff0000 !important;
            transition: none !important;
        }

        body.error-alert button.submit-btn {
            background-color: #ff0000 !important;
            transition: none !important;
        }

        body.error-alert .lang-menu, body.error-alert .timer-link {
            border-color: #ff0000 !important;
            color: #ff0000 !important;
            transition: none !important;
        }

        .box {
            border: 2px solid #00ff00;
            padding: 40px;
            display: inline-block;
            border-radius: 10px;
            background-color: #050505;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.3);
            transition: all 1s ease; 
            max-width: 500px;
            width: 100%;
            box-sizing: border-box;
        }

        .lang-menu {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #000;
            border: 1px solid #00ff00;
            color: #00ff00;
            padding: 8px 12px;
            font-family: monospace;
            font-size: 14px;
            z-index: 9999;
            outline: none;
            cursor: pointer;
            transition: all 1s ease;
        }

        .lang-menu option {
            background: #000;
            color: #00ff00;
        }

        .timer-link {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: transparent;
            border: 1px dashed #00ff00;
            color: #00ff00;
            padding: 8px 15px;
            text-decoration: none;
            font-family: monospace;
            font-size: 16px;
            cursor: pointer;
            z-index: 9999;
            transition: border 1s ease, color 1s ease, background 0.2s;
        }

        .timer-link:hover {
            background: rgba(0, 255, 0, 0.1);
            border-style: solid;
        }

        .input-container {
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        input {
            background: #111;
            border: 1px solid #00ff00;
            color: #00ff00;
            padding: 10px;
            font-family: monospace;
            font-size: 18px;
            outline: none;
            transition: all 1s ease;
            width: 100%;
        }

        button.submit-btn {
            background: #00ff00;
            color: #000;
            padding: 10px 20px;
            font-weight: bold;
            border: none;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 1s ease;
        }

        button.submit-btn:hover {
            background: #00cc00;
        }

        #text, #archiveText {
            font-size: 20px;
            line-height: 1.4;
            white-space: pre-line;
            text-shadow: 0 0 5px rgba(0, 255, 0, 0.5);
            animation: tv-text-jump 0.8s steps(1) infinite;
        }

        #text {
            margin-bottom: 25px;
            min-height: 50px;
            text-align: center;
        }

        #archiveText {
            text-align: left;
            font-size: 18px;
            line-height: 1.6;
        }

        body.error-alert #text {
            text-shadow: 0 0 7px rgba(255, 0, 0, 0.7);
            animation: tv-text-jump-heavy 0.3s steps(1) infinite;
        }

        @keyframes tv-text-jump {
            0% { transform: translate(0, 0); }
            12% { transform: translate(-3px, 1px); }
            15% { transform: translate(0, 0); }
            55% { transform: translate(2px, -1px); }
            57% { transform: translate(0, 0); }
            90% { transform: translate(-1px, -2px); }
            93% { transform: translate(0, 0); }
        }

        @keyframes tv-text-jump-heavy {
            0% { transform: translate(0, 0); }
            10% { transform: translate(-6px, 3px); }
            20% { transform: translate(4px, -4px); }
            30% { transform: translate(0, 0); }
            50% { transform: translate(-5px, -2px); }
            60% { transform: translate(6px, 4px); }
            70% { transform: translate(0, 0); }
            90% { transform: translate(-3px, 5px); }
        }
    </style>
</head>
<body>

    <div class="box" id="gameScreen">
        <div id="text"></div>
        <div class="input-container" id="inputContainer">
            <input type="text" id="userAnswer" placeholder="" autocomplete="off">
            <button class="submit-btn" id="submitBtn" onclick="checkCode()">ВВОД</button>
        </div>
    </div>

    <div class="box" id="archiveScreen" style="display: none;">
        <div id="archiveText"></div>
    </div>

    <a href="javascript:void(0)" class="timer-link" id="countdownTimer" onclick="toggleScreens()">00d 00h 00m 00s</a>

    <select class="lang-menu" id="langSelect" onchange="changeLanguage(this.value)">
        <option value="ru">Русский</option>
        <option value="en">English</option>
    </select>

    <script src="script.js"></script>
</body>
</html>
