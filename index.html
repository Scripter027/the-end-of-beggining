<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The End of Beginnings</title>
    <style>
        :root {
            --neon-green: #00ff33;
            --dark-green: #003300;
            --bright-green: #66ff66;
            --neon-red: #ff3333;
            --dark-red: #330000;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body, html {
            background-color: #000;
            color: var(--neon-green);
            font-family: 'Courier New', Courier, monospace;
            height: 100%;
            width: 100%;
            overflow: hidden;
            transition: background-color 0.1s ease;
        }

        /* Эффект красной вспышки при ошибке */
        body.wrong-flash {
            background-color: var(--dark-red) !important;
            color: var(--neon-red) !important;
        }
        body.wrong-flash .terminal-input, 
        body.wrong-flash .btn-submit {
            border-color: var(--neon-red) !important;
            color: var(--neon-red) !important;
            box-shadow: 0 0 10px var(--neon-red) !important;
        }
        body.wrong-flash .timer, body.wrong-flash .lang-switch {
            color: var(--neon-red) !important;
        }

        /* Зеленая вспышка при успехе */
        body.correct-flash {
            background-color: var(--bright-green) !important;
            color: #000 !important;
        }

        /* Эффект ЭЛТ-монитора */
        body::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 999;
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
        }

        /* Экраны загрузки */
        #boot-screen {
            position: absolute;
            top: 15px;
            left: 15px;
            font-size: 14px;
            line-height: 1.4;
            max-width: 90%;
            z-index: 10;
        }

        /* Главный контейнер по центру */
        #main-container {
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            width: 100%;
            padding: 20px;
            position: relative;
        }

        /* Таймер сверху по центру */
        .timer-wrapper {
            position: absolute;
            top: 5%;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            cursor: pointer;
            width: 90%;
        }

        .timer-title {
            font-size: 12px;
            margin-bottom: 5px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .timer {
            font-size: 26px;
            font-weight: bold;
            text-shadow: 0 0 10px var(--neon-green);
            transition: font-size 0.3s ease;
        }

        .secret-active .timer {
            font-size: 40px;
        }

        /* Адаптивный терминал строго по центру */
        .terminal-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 600px;
            padding: 10px;
        }

        .terminal-output {
            min-height: 80px;
            margin-bottom: 25px;
            text-align: center;
            font-size: 18px;
            width: 100%;
            word-wrap: break-word;
            line-height: 1.4;
        }

        .input-group {
            display: flex;
            width: 100%;
            gap: 10px;
        }

        .terminal-input {
            flex: 1;
            background: transparent;
            border: 2px solid var(--neon-green);
            padding: 12px;
            color: var(--neon-green);
            font-family: inherit;
            font-size: 16px;
            outline: none;
            box-shadow: 0 0 5px var(--dark-green);
            border-radius: 0;
            -webkit-appearance: none;
        }

        .btn-submit {
            background: transparent;
            border: 2px solid var(--neon-green);
            color: var(--neon-green);
            padding: 12px 20px;
            font-family: inherit;
            font-size: 16px;
            cursor: pointer;
            outline: none;
            box-shadow: 0 0 5px var(--dark-green);
            transition: all 0.2s ease;
            border-radius: 0;
        }

        /* Переключатель языка снизу справа */
        .lang-switch {
            position: absolute;
            bottom: 20px;
            right: 20px;
            font-size: 16px;
            cursor: pointer;
            opacity: 0.7;
            padding: 5px;
        }

        /* Медиа-запросы для телефонов */
        @media (max-width: 480px) {
            .timer { font-size: 20px; }
            .secret-active .timer { font-size: 28px; }
            .terminal-output { font-size: 15px; min-height: 90px; }
            .input-group { flex-direction: column; }
            .btn-submit { width: 100%; }
        }
    </style>
</head>
<body>

    <div id="boot-screen"></div>

    <div id="main-container">
        <div class="timer-wrapper" id="timer-toggle">
            <div class="timer-title" id="timer-label">До 22 февраля 2027 осталось:</div>
            <div class="timer" id="countdown">00:00:00:00</div>
        </div>

        <div class="terminal-box">
            <div class="terminal-output" id="response-text">ВВЕДИТЕ ПАРОЛЬ</div>
            <div class="input-group">
                <input type="text" id="user-input" class="terminal-input" autofocus autocomplete="off" placeholder="> ">
                <button id="submit-btn" class="btn-submit">ВВОД</button>
            </div>
        </div>

        <div class="lang-switch" id="lang-btn">EN</div>
    </div>
    <script>
        const targetDate = new Date('2027-02-22T00:00:00').getTime();
        let currentLang = 'ru';
        let isSecretMode = false;
        let isLock = false;
        let currentStep = 0; // Этап квеста

        // База текстов под два языка
        const langData = {
            ru: {
                boot: ["ЗАГРУЗКА ЯДРА v4.01...", "ПРОВЕРКА СВЯЗИ С KEEPER ENT... OK", "СИСТЕМА ГОТОВА."],
                labelNormal: "До 22 февраля 2027 осталось:",
                labelSecret: "Отсчет до момента x",
                wrong: "НЕПРАВИЛЬНО",
                defaultPrompt: "ВВЕДИТЕ ПАРОЛЬ",
                steps: {
                    0: { trigger: ["ПАРОЛЬ", "PASSWORD"], reply: "Серьезно? Ты жалок. Ладно дам подсказку - 12 + 4." },
                    1: { trigger: ["16"], reply: "Молодец! Кстати столько лет подряд ИИ подбирал бы пароль. Скажи слово побег но без о и е" },
                    2: { trigger: ["ПБГ", "ESCAP"], reply: "ладно на самом деле у меня нет пароля. Прости, но разбирайся *сам*" },
                    3: { trigger: ["САМ", "YOURSELF"], reply: "я же сказал у ме123+123ня ничего нет! Я чист!" },
                    4: { trigger: ["246"], reply: "ДОВОЛЬНО! У МЕНЯ НЕТ ПАРОЛЯ! *!!!!!*" },
                    5: { trigger: ["!!!!!", "!!!!!"], reply: "Вот пароль! Подавись им и прочь отсюда: va*фwn%чи+adьs>рф\$лнхя'xw1%йкl_5чigpтыои]?еje# !" },
                    6: { trigger: ["VA*ФWN%ЧИ+ADЬS>РФ\$ЛНХЯ'XW1%ЙКL_5ЧIGPТЫОИ]?ЕJE#"], reply: "Новая Эра Keeper Ent. вот вот начнется." }
                }
            },
            en: {
                boot: ["LOADING KERNEL v4.01...", "CONNECTING KEEPER ENT... OK", "SYSTEM READY."],
                labelNormal: "Until February 22, 2027 left:",
                labelSecret: "Countdown to moment x",
                wrong: "WRONG",
                defaultPrompt: "ENTER PASSWORD",
                steps: {
                    0: { trigger: ["ПАРОЛЬ", "PASSWORD"], reply: "Seriously? You are pathetic. Fine, I'll give you a hint - 12 + 4." },
                    1: { trigger: ["16"], reply: "Well done! By the way, that's how many years in a row an AI would brute-force the password. Say the word 'escape' but without vowels" },
                    2: { trigger: ["ПБГ", "ESCAP"], reply: "fine, the truth is I don't have a password. Sorry, but deal with it *yourself*" },
                    3: { trigger: ["САМ", "YOURSELF"], reply: "I ha123+123ve nothing, I told you! I am clean!" },
                    4: { trigger: ["246"], reply: "ENOUGH! I DON'T HAVE A PASSWORD! *!!!!!*" },
                    5: { trigger: ["!!!!!", "!!!!!"], reply: "Here is the password! Choke on it and get out: va*фwn%чи+adьs>рф\$лнхя'xw1%йкl_5чigpтыои]?еje# !" },
                    6: { trigger: ["VA*ФWN%ЧИ+ADЬS>РФ\$ЛНХЯ'XW1%ЙКL_5ЧIGPТЫОИ]?ЕJE#"], reply: "A New Era of Keeper Ent. is about to begin." }
                }
            }
        };

        // Запуск строк при загрузке
        const bootScreen = document.getElementById('boot-screen');
        const mainContainer = document.getElementById('main-container');
        let bootLine = 0;

        function printBootLines() {
            if (bootLine < langData[currentLang].boot.length) {
                bootScreen.innerHTML += langData[currentLang].boot[bootLine] + '<br>';
                bootLine++;
                setTimeout(printBootLines, 200);
            } else {
                setTimeout(() => {
                    bootScreen.style.display = 'none';
                    mainContainer.style.display = 'flex';
                    document.getElementById('user-input').focus();
                }, 400);
            }
        }
        printBootLines();

        // Логика таймера
        function updateTimer() {
            const distance = targetDate - new Date().getTime();
            if (distance < 0) {
                document.getElementById('countdown').innerHTML = "00:00:00:00";
                return;
            }
            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById('countdown').innerHTML = 
                `${days < 10 ? '0'+days : days}:${hours < 10 ? '0'+hours : hours}:${minutes < 10 ? '0'+minutes : minutes}:${seconds < 10 ? '0'+seconds : seconds}`;
        }
        setInterval(updateTimer, 1000);
        updateTimer();

        // Переключение режимов таймера
        document.getElementById('timer-toggle').addEventListener('click', () => {
            isSecretMode = !isSecretMode;
            mainContainer.classList.toggle('secret-active', isSecretMode);
            document.getElementById('timer-label').innerText = isSecretMode ? langData[currentLang].labelSecret : langData[currentLang].labelNormal;
        });

        // Переключение Языков (Текст на экране не сбрасывается)
        document.getElementById('lang-btn').addEventListener('click', () => {
            currentLang = currentLang === 'ru' ? 'en' : 'ru';
            document.getElementById('lang-btn').innerText = currentLang === 'ru' ? 'EN' : 'RU';
            document.getElementById('timer-label').innerText = isSecretMode ? langData[currentLang].labelSecret : langData[currentLang].labelNormal;
        });

        // Логика проверки цепочки ARG
        function checkCode() {
            if (isLock) return;
            const inputField = document.getElementById('user-input');
            const outputField = document.getElementById('response-text');
            const rawValue = inputField.value.trim();
            const cleanCode = rawValue.toUpperCase();
            
            if (cleanCode === "") return;

            const expectedTriggers = langData[currentLang].steps[currentStep].trigger;
            const isCorrect = expectedTriggers.some(t => cleanCode === t || cleanCode.includes(t));

            if (isCorrect) {
                // Продвигаемся по сюжету
                const stepReply = langData[currentLang].steps[currentStep].reply;
                outputField.innerText = stepReply;
                
                // Эффект верного ввода (зеленая вспышка)
                if (currentStep === 6) {
                    isLock = true; // Финал игры
                    document.body.classList.add('correct-flash');
                    setTimeout(() => document.body.classList.remove('correct-flash'), 500);
                } else {
                    currentStep++;
                }
                inputField.value = "";
            } else {
                // ОШИБКА: экран горит красным несколько секунд, затем возвращается "ВВЕДИТЕ ПАРОЛЬ"
                isLock = true;
                outputField.innerText = langData[currentLang].wrong;
                document.body.classList.add('wrong-flash');

                setTimeout(() => {
                    document.body.classList.remove('wrong-flash');
                    outputField.innerText = langData[currentLang].defaultPrompt;
                    isLock = false;
                    inputField.value = "";
                    inputField.focus();
                }, 3000); // 3 секунды на красную вспышку
            }
        }

        // Активация кнопками
        document.getElementById('submit-btn').addEventListener('click', checkCode);
        document.getElementById('user-input').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') checkCode();
        });
    </script>
</body>
</html>
