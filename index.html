<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>The End of Beginnings</title>
<style>
@import url('https://googleapis.com');
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #000; color: #0f0; font-family: 'Share+Tech+Mono', monospace; height: 100vh; height: calc(var(--vh, 1vh) * 100); overflow: hidden; position: relative; transition: color 0.1s ease; }
body::after { content: " "; display: block; position: absolute; top: 0; left: 0; bottom: 0; right: 0; background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06)); z-index: 999; background-size: 100% 4px, 6px 100%; pointer-events: none; }
.glare { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle, rgba(0,30,0,0.15) 0%, rgba(0,0,0,0) 80%); pointer-events: none; z-index: 998; }
#boot-screen { position: absolute; width: 100%; height: 100%; background: #000; padding: 15px; overflow: hidden; z-index: 10; font-size: 13px; line-height: 1.4; white-space: pre-wrap; word-break: break-all; }
#main-screen { display: none; height: 100vh; height: calc(var(--vh, 1vh) * 100); flex-direction: column; justify-content: space-between; padding: 15px; position: relative; }
body.wrong-state { color: #f00 !important; }
body.wrong-state #timer-container, body.wrong-state .input-panel, body.wrong-state #lang-toggle { border-color: #f00 !important; color: #f00 !important; box-shadow: 0 0 15px rgba(255,0,0,0.2) !important; }
body.wrong-state .input-panel input { color: #f00 !important; }
body.wrong-state .input-panel button { background: #f00 !important; color: #000 !important; }
body.wrong-state #terminal-output { color: #f00 !important; }
.correct-flash { animation: flash-green 0.4s ease-out; }
@keyframes flash-green { 0% { background: #4f4; color: #000; } 10% { background: #4f4; } 100% { background: #000; } }
header { display: flex; justify-content: center; align-items: center; position: relative; height: 50px; margin-top: 5px; }
#timer-container { cursor: pointer; text-align: center; border: 1px solid #0f0; padding: 8px 16px; background: rgba(0,20,0,0.4); text-transform: uppercase; letter-spacing: 1px; font-size: 16px; box-shadow: 0 0 10px rgba(0,255,0,0.2); user-select: none; -webkit-tap-highlight-color: transparent; transition: all 0.1s ease; }
#timer-container:hover { background: #0f0; color: #000; }
.center-container { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 20px; width: 100%; padding: 0 10px; }
#terminal-output { width: 100%; max-width: 600px; text-align: center; min-height: 60px; font-size: 18px; letter-spacing: 1px; word-break: break-word; display: flex; align-items: center; justify-content: center; line-height: 1.4; }
#terminal-output em { font-style: italic; text-decoration: underline; font-weight: bold; }
#terminal-output a { color: inherit; text-decoration: underline; font-weight: bold; }
.input-panel { display: flex; align-items: center; gap: 10px; width: 100%; max-width: 500px; background: rgba(0,10,0,0.5); border: 1px solid #0f0; padding: 6px 12px; box-shadow: 0 0 15px rgba(0,255,0,0.1); transition: all 0.1s ease; }
.input-panel input { flex: 1; background: transparent; border: none; outline: none; color: #0f0; font-family: 'Share+Tech+Mono', monospace; font-size: 18px; padding: 6px 0; width: 100%; }
.input-panel button { background: #0f0; color: #000; border: none; font-family: 'Share+Tech+Mono', monospace; font-size: 16px; font-weight: bold; padding: 10px 20px; cursor: pointer; text-transform: uppercase; -webkit-tap-highlight-color: transparent; }
.input-panel button:hover { background: #0a0; }
footer { display: flex; justify-content: flex-end; align-items: center; padding: 5px 5px; height: 40px; }
#lang-toggle { cursor: pointer; border: 1px solid #0f0; padding: 6px 14px; font-size: 14px; background: transparent; color: #0f0; font-family: 'Share+Tech+Mono', monospace; -webkit-tap-highlight-color: transparent; transition: all 0.1s ease; }
#lang-toggle:hover { background: #0f0; color: #000; }
#secret-screen { display: none; height: 100vh; height: calc(var(--vh, 1vh) * 100); flex-direction: column; justify-content: center; align-items: center; background: #000; color: #0f0; padding: 20px; text-align: center; position: relative; }
#secret-title { font-size: 22px; letter-spacing: 3px; margin-bottom: 25px; text-transform: uppercase; animation: pulse 2s infinite; padding: 0 10px; }
#secret-timer { font-size: 34px; font-weight: bold; letter-spacing: 2px; border: 2px solid #0f0; padding: 15px 25px; background: rgba(0,15,0,0.3); box-shadow: 0 0 25px rgba(0,255,0,0.3); width: 100%; max-width: 420px; white-space: nowrap; }
#back-btn { margin-top: 40px; border: 1px solid #0f0; background: transparent; color: #0f0; font-family: 'Share+Tech+Mono', monospace; font-size: 16px; padding: 10px 24px; cursor: pointer; text-transform: uppercase; -webkit-tap-highlight-color: transparent; }
#back-btn:hover { background: #0f0; color: #000; }
@keyframes pulse { 0% { opacity: 0.7; } 50% { opacity: 1; text-shadow: 0 0 15px #0f0; } 100% { opacity: 0.7; } }
@media (max-width: 480px) {
  #boot-screen { font-size: 11px; padding: 10px; }
  #main-screen { padding: 10px; }
  #timer-container { font-size: 14px; padding: 6px 12px; }
  #terminal-output { font-size: 15px; min-height: 70px; }
  .input-panel { flex-direction: column; gap: 12px; padding: 10px; background: rgba(0,15,0,0.7); }
  .input-panel input { text-align: center; border-bottom: 1px dashed rgba(0,255,0,0.3); padding-bottom: 8px; font-size: 16px; }
  .input-panel button { width: 100%; padding: 12px; font-size: 16px; }
  #secret-title { font-size: 18px; letter-spacing: 2px; }
  #secret-timer { font-size: 26px; padding: 12px 15px; max-width: 290px; }
  #back-btn { width: 80%; max-width: 200px; padding: 12px; }
}
@media (min-width: 481px) and (max-width: 768px) {
  #timer-container { font-size: 16px; }
  #secret-timer { font-size: 38px; max-width: 380px; }
}
</style>
</head>
<body>
<div class="glare"></div>
<div id="boot-screen"></div>

<div id="main-screen">
  <header>
    <div id="timer-container" onclick="openSecret()">00:00:00:00</div>
  </header>

  <div class="center-container">
    <div id="terminal-output"></div>
    <div class="input-panel" id="panel-box">
      <input type="text" id="terminal-input" autocomplete="off" autocapitalize="off" autofocus placeholder="">
      <button id="submit-btn" onclick="processInput()"></button>
    </div>
  </div>

  <footer>
    <button id="lang-toggle" onclick="toggleLang()">EN</button>
  </footer>
</div>

<div id="secret-screen">
  <div id="secret-title"></div>
  <div id="secret-timer">00:00:00:00</div>
  <button id="back-btn" onclick="closeSecret()"></button>
</div>
<script>
const targetDate = new Date('2027-02-22T00:00:00').getTime();
let currentLang = 'RU';
let currentStep = 0;
let isLockout = false;

function resetHeight() {
  document.documentElement.style.setProperty('--vh', (window.innerHeight * 0.01) + 'px');
}
window.addEventListener('resize', resetHeight);
resetHeight();

const bootLines = [
  "CORE::INIT -> LAUNCHING TERMINAL SUBSYSTEM",
  "LOADING CORE MODULES.......................[OK]",
  "ESTABLISHING SECURE PROTOCOLS...............[OK]",
  "DECRYPTING KEEPER NETWORKS..................[OK]",
  "WARNING: CHANNELS ARE UNSTABLE",
  "IDENTITY VERIFICATION REJECTED. ANONYMOUS STATUS ASSIGNED.",
  "SYSTEM IS READY. DO NOT WASTE MY TIME."
];

const localization = {
  RU: {
    submit: "ВВОД",
    secretTitle: "Отсчет до момента x",
    back: "Назад",
    init: "ВВЕДИТЕ ПАРОЛЬ",
    wrongPrefix: "НЕВЕРНО. ",
    emptyError: "НЕВЕРНО серьезно пустая строка?",
    step0_hint: "Серьезно? Ты жалок. Ладно дам подсказку - 12 + 4.",
    step1_next: "Молодец! Кстати столько лет подряд ИИ подбирал бы пароль. Скажи слово побег но без о и е",
    step2_next: "ладно на самом деле у меня нет пароля. Прости, но разбирайся <em>сам</em>",
    step3_next: "я же сказал у ме123+123ня ничего нет! Я чист!",
    step4_next: "ДОВОЛЬНО! У МЕНЯ НЕТ ПАРОЛЯ! <em>!!!!!</em>",
    step5_next: "Вот пароль! Подавись им и прочь отсюда: va*фwn%чи+adьs>рф$лнхя'xw1%йкl_5чigpтыои]?еje#",
    era: "Новая Эра Keeper Ent. вот вот начнется.",
    scolded: [
      "Мимо. Еще раз подумай.",
      "Слабо. Очень слабо.",
      "И это всё, на что ты способен?",
      "Не угадал. Твоя логика пуста.",
      "Прекрати перебирать мусор.",
      "Система видит твою растерянность."
    ]
  },
  EN: {
    submit: "ENTER",
    secretTitle: "Countdown to moment x",
    back: "Back",
    init: "ENTER PASSWORD",
    wrongPrefix: "WRONG. ",
    emptyError: "WRONG seriously an empty string?",
    step0_hint: "Seriously? You are pathetic. Fine, I'll give you a hint - 12 + 4.",
    step1_next: "Well done! By the way, that's exactly how many years in a row an AI would crack a password. Say the word escape but without o and e",
    step2_next: "okay, honestly I don't have a password. Sorry, deal with it <em>myself</em>",
    step3_next: "I told you I ha123+123ve nothing! I am clean!",
    step4_next: "ENOUGH! I HAVE NO PASSWORD! <em>!!!!!</em>",
    step5_next: "Here is the password! Choke on it and get out: va*фwn%чи+adьs>рф$лнхя'xw1%йкl_5чigpтыои]?еje#",
    era: "The New Era of Keeper Ent. is about to begin.",
    scolded: [
      "Missed. Think again.",
      "Weak. Pathetic.",
      "Is that all you can do?",
      "Wrong guess. Your logic is empty.",
      "Stop entering garbage.",
      "The system sees your confusion."
    ]
  }
};

const easterEggs = {
  "67": {
    RU: "Перестань деградировать и займись делом!",
    EN: "Stop degrading yourself and get to work!"
  },
  "бурмалда": {
    RU: "не ну ты молодец конечно что за молодежные мемчики шаришь, но это не пароль!",
    EN: "Ne nu to molded konechno chto za molodezhnie memchiki sharish, no eto ne parol."
  },
  "привет": {
    RU: "Пока до тех пор пока не найдешь пароль!",
    EN: "Bye until you find the password!"
  },
  "hello": {
    RU: "Пока до тех пор пока не найдешь пароль!",
    EN: "Bye until you find the password!"
  },
  "кто ты": {
    RU: "Терминал, который ждет твоего правильного пароля! Мне не платят за пустую болтовню с тобой!",
    EN: "A terminal waiting for your correct password! I don't get paid for empty small talk with you!"
  },
  "who are you": {
    RU: "Терминал, который ждет твоего правильного пароля! Мне не платят за пустую болтовню с тобой!",
    EN: "A terminal waiting for your correct password! I don't get paid for empty small talk with you!"
  },
  "где я": {
    RU: "Откуда я то знаю? Ты открыл сайт с поиском пароля, а находится ты можешь где угодно!",
    EN: "How should I know? You opened a password search site, you could be anywhere!"
  },
  "where am i": {
    RU: "Откуда я то знаю? Ты открыл сайт с поиском пароля, а находится ты можешь где угодно!",
    EN: "How should I know? You opened a password search site, you could be anywhere!"
  },
  "какой пароль": {
    RU: "Ты мне скажи.",
    EN: "You tell me."
  },
  "what is the password": {
    RU: "Ты мне скажи.",
    EN: "You tell me."
  },
  "новая эра": {
    RU: '<a href="https://t.me" target="_blank">https://t.me</a>',
    EN: '<a href="https://t.me" target="_blank">https://t.me</a>'
  },
  "new era": {
    RU: '<a href="https://t.me" target="_blank">https://t.me</a>',
    EN: '<a href="https://t.me" target="_blank">https://t.me</a>'
  }
};
function runBootSequence() {
  const container = document.getElementById('boot-screen');
  let lineIdx = 0;
  function addLine() {
    if (lineIdx < bootLines.length) {
      container.innerHTML += bootLines[lineIdx] + "\n";
      lineIdx++;
      setTimeout(addLine, Math.random() * 200 + 80);
    } else {
      setTimeout(() => {
        container.style.display = 'none';
        document.getElementById('main-screen').style.display = 'flex';
        updateUI();
        document.getElementById('terminal-output').innerHTML = localization[currentLang].init;
        document.getElementById('terminal-input').focus();
      }, 500);
    }
  }
  addLine();
}

function updateTimers() {
  const now = new Date().getTime();
  const diff = targetDate - now;
  if (diff <= 0) {
    document.getElementById('timer-container').innerText = "00:00:00:00";
    document.getElementById('secret-timer').innerText = "00:00:00:00";
    return;
  }
  const days = Math.floor(diff / (1000 * 60 * 60 * 24));
  const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
  const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
  const seconds = Math.floor((diff % (1000 * 60)) / 1000);
  const pad = (num) => String(num).padStart(2, '0');
  const timerStr = pad(days) + ":" + pad(hours) + ":" + pad(minutes) + ":" + pad(seconds);
  document.getElementById('timer-container').innerText = timerStr;
  document.getElementById('secret-timer').innerText = timerStr;
}

function toggleLang() {
  if(isLockout) return;
  currentLang = currentLang === 'RU' ? 'EN' : 'RU';
  document.getElementById('lang-toggle').innerText = currentLang === 'RU' ? 'EN' : 'RU';
  updateUI();
  
  if (currentStep === 0) document.getElementById('terminal-output').innerHTML = localization[currentLang].init;
  else if (currentStep === 1) document.getElementById('terminal-output').innerHTML = localization[currentLang].step0_hint;
  else if (currentStep === 2) document.getElementById('terminal-output').innerHTML = localization[currentLang].step1_next;
  else if (currentStep === 3) document.getElementById('terminal-output').innerHTML = localization[currentLang].step2_next;
  else if (currentStep === 4) document.getElementById('terminal-output').innerHTML = localization[currentLang].step3_next;
  else if (currentStep === 5) document.getElementById('terminal-output').innerHTML = localization[currentLang].step4_next;
  else if (currentStep === 6) document.getElementById('terminal-output').innerHTML = localization[currentLang].step5_next;
}

function updateUI() {
  document.getElementById('submit-btn').innerText = localization[currentLang].submit;
  document.getElementById('secret-title').innerText = localization[currentLang].secretTitle;
  document.getElementById('back-btn').innerText = localization[currentLang].back;
}

function openSecret() {
  if(isLockout) return;
  document.getElementById('main-screen').style.display = 'none';
  document.getElementById('secret-screen').style.display = 'flex';
}

function closeSecret() {
  document.getElementById('secret-screen').style.display = 'none';
  document.getElementById('main-screen').style.display = 'flex';
  setTimeout(() => { document.getElementById('terminal-input').focus(); }, 50);
}

function triggerRedLockout(customMsg) {
  isLockout = true;
  document.body.classList.add('wrong-state');
  const inputEl = document.getElementById('terminal-input');
  const outputEl = document.getElementById('terminal-output');
  
  if (customMsg) {
    outputEl.innerHTML = customMsg;
  } else {
    const lines = localization[currentLang].scolded;
    const randomLine = lines[Math.floor(Math.random() * lines.length)];
    outputEl.innerHTML = localization[currentLang].wrongPrefix + randomLine;
  }
  
  inputEl.disabled = true;
  
  setTimeout(() => {
    document.body.classList.remove('wrong-state');
    inputEl.disabled = false;
    inputEl.value = '';
    isLockout = false;
    inputEl.focus();
  }, 2000);
}

function triggerGreenSuccess(msg) {
  const mainScreen = document.getElementById('main-screen');
  const inputEl = document.getElementById('terminal-input');
  const outputEl = document.getElementById('terminal-output');
  
  void mainScreen.offsetWidth;
  mainScreen.classList.add('correct-flash');
  outputEl.innerHTML = msg;
  inputEl.value = '';
  setTimeout(() => {
    mainScreen.classList.remove('correct-flash');
  }, 400);
}

function cleanInput(val) {
  let cleaned = val.trim();
  if (cleaned === '!!!!!') {
    return cleaned;
  }
  while (cleaned.endsWith('.') || cleaned.endsWith('?')) {
    cleaned = cleaned.slice(0, -1).trim();
  }
  return cleaned;
}

function processInput() {
  if (isLockout) return;
  
  const inputEl = document.getElementById('terminal-input');
  let rawVal = inputEl.value;
  
  if (!rawVal.trim()) {
    triggerRedLockout(localization[currentLang].emptyError);
    return;
  }
  
  rawVal = cleanInput(rawVal).toLowerCase();
  
  if (!rawVal) {
    triggerRedLockout(localization[currentLang].emptyError);
    return;
  }
  
  if (easterEggs[rawVal]) {
    triggerGreenSuccess(easterEggs[rawVal][currentLang]);
    return;
  }
  
  const truePass = "va*фwn%чи+adьs>рф$лнхя'xw1%йкl_5чigpтыои]?еje#".toLowerCase();

  if (rawVal === truePass) {
    triggerGreenSuccess(localization[currentLang].era);
    return;
  }
  
  if (currentStep === 0) {
    if (rawVal === "пароль" || rawVal === "password") {
      triggerGreenSuccess(localization[currentLang].step0_hint);
      currentStep = 1;
    } else {
      triggerRedLockout();
    }
  } 
  else if (currentStep === 1) {
    if (rawVal === "16") {
      triggerGreenSuccess(localization[currentLang].step1_next);
      currentStep = 2;
    } else {
      triggerRedLockout();
    }
  } 
  else if (currentStep === 2) {
    if (rawVal === "пбг" || rawVal === "scp" || rawVal === "scap" || rawVal === "scpe") {
      triggerGreenSuccess(localization[currentLang].step2_next);
      currentStep = 3;
    } else {
      triggerRedLockout();
    }
  } 
  else if (currentStep === 3) {
    if (rawVal === "сам" || rawVal === "myself") {
      triggerGreenSuccess(localization[currentLang].step3_next);
      currentStep = 4;
    } else {
      triggerRedLockout();
    }
  } 
  else if (currentStep === 4) {
    if (rawVal === "246") {
      triggerGreenSuccess(localization[currentLang].step4_next);
      currentStep = 5;
    } else {
      triggerRedLockout();
    }
  } 
  else if (currentStep === 5) {
    if (rawVal === "!!!!!") {
      triggerGreenSuccess(localization[currentLang].step5_next);
      currentStep = 6;
    } else {
      triggerRedLockout();
    }
  }
  else {
    triggerRedLockout();
  }
}

document.getElementById('terminal-input').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') {
    processInput();
  }
});

setInterval(updateTimers, 1000);
updateTimers();
window.onload = runBootSequence;
</script>
</body>
</html>
