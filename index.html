    return decodeURIComponent(escape(atob(baseStr)));
  } catch (e) {
    return "";

function getSecureHash(str) {
  let hash = 0;
  for (let i = 0; i < str.length; i++) {
    const char = str.charCodeAt(i);
    hash = ((hash << 5) - hash) + char;
    hash |= 0;
  }
  return String(hash);
}

function runBootSequence() {
  const container = document.getElementById('boot-screen');
  let lineIdx = 0;
  function addLine() {
    if (lineIdx < bootLines.length) {
      container.innerHTML += bootLines[lineIdx] + "\n";
      lineIdx++;
      setTimeout(addLine, Math.random() * 200 + 80);
    } else {
      setTimeout(() => {
        container.style.display = 'none';
        document.getElementById('main-screen').style.display = 'flex';
        updateUI();
        document.getElementById('terminal-output').innerHTML = getDecryptedText('init', currentLang, 'sys');
        document.getElementById('terminal-input').focus();
      }, 500);
    }
  }
  addLine();
}

function updateTimers() {
  const now = new Date().getTime();
  const diff = targetDate - now;
  if (diff <= 0) {
    document.getElementById('timer-container').innerText = "00:00:00:00";
    document.getElementById('secret-timer').innerText = "00:00:00:00";
    return;
  }
  const days = Math.floor(diff / (1000 * 60 * 60 * 24));
  const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
  const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
  const seconds = Math.floor((diff % (1000 * 60)) / 1000);
  const pad = (num) => String(num).padStart(2, '0');
  const timerStr = pad(days) + ":" + pad(hours) + ":" + pad(minutes) + ":" + pad(seconds);
  document.getElementById('timer-container').innerText = timerStr;
  document.getElementById('secret-timer').innerText = timerStr;
}

function showToast() {

  if(isLockout) return;
  currentLang = currentLang === 'RU' ? 'EN' : 'RU';
  document.getElementById('lang-toggle').innerText = currentLang === 'RU' ? 'EN' : 'RU';
  updateUI();
  showToast();
  
  if (customMessageActive && currentCustomKey) {
    if (currentCustomKey === "tg_link") {
      document.getElementById('terminal-output').innerHTML = '<a href="' + tgLink + '" target="_blank">' + tgLink + '</a>';
    } else {
      document.getElementById('terminal-output').innerHTML = getDecryptedText(currentCustomKey, currentLang, 'egg');
    }
  } else {
    if (currentStep === 0) document.getElementById('terminal-output').innerHTML = getDecryptedText('init', currentLang, 'sys');
    else if (currentStep === 1) document.getElementById('terminal-output').innerHTML = getDecryptedText('step0_hint', currentLang, 'sys');
    else if (currentStep === 2) document.getElementById('terminal-output').innerHTML = getDecryptedText('step1_next', currentLang, 'sys');
    else if (currentStep === 3) document.getElementById('terminal-output').innerHTML = getDecryptedText('step2_next', currentLang, 'sys');
    else if (currentStep === 4) document.getElementById('terminal-output').innerHTML = getDecryptedText('step3_next', currentLang, 'sys');
    else if (currentStep === 5) document.getElementById('terminal-output').innerHTML = getDecryptedText('step4_next', currentLang, 'sys');
    else if (currentStep === 6) document.getElementById('terminal-output').innerHTML = getDecryptedText('step5_next', currentLang, 'sys');
    else if (currentStep === 7) document.getElementById('terminal-output').innerHTML = getDecryptedText('era', currentLang, 'sys');
  }
}

function updateUI() {
  document.getElementById('submit-btn').innerText = getDecryptedText('submit', currentLang, 'sys');
  document.getElementById('secret-title').innerText = getDecryptedText('secretTitle', currentLang, 'sys');
  document.getElementById('back-btn').innerText = getDecryptedText('back', currentLang, 'sys');
}

function openSecret() {
  if(isLockout) return;
  document.getElementById('main-screen').style.display = 'none';
  document.getElementById('secret-screen').style.display = 'flex';
}

function closeSecret() {
  document.getElementById('secret-screen').style.display = 'none';
  document.getElementById('main-screen').style.display = 'flex';
  setTimeout(() => { document.getElementById('terminal-input').focus(); }, 50);
}

function triggerRedLockout(customMsg) {
  isLockout = true;
  document.body.classList.add('wrong-state');
  const inputEl = document.getElementById('terminal-input');
  const outputEl = document.getElementById('terminal-output');
  
  if (customMsg) {
    outputEl.innerHTML = customMsg;
  } else {
    const list = encryptedLocalization[currentLang].scolded;
    const randIdx = Math.floor(Math.random() * list.length);
    try {
      const rawLine = decodeURIComponent(escape(atob(list[randIdx])));
      outputEl.innerHTML = getDecryptedText('wrongPrefix', currentLang, 'sys') + rawLine;
    } catch(e) {
      outputEl.innerHTML = getDecryptedText('wrongPrefix', currentLang, 'sys');
    }
  }
  inputEl.disabled = true;
  
  setTimeout(() => {
    document.body.classList.remove('wrong-state');
    inputEl.disabled = false;
    inputEl.value = '';
    isLockout = false;
    inputEl.focus();
  }, 2000);
}

function triggerGreenSuccess(msg, isEgg = false, eggKey = null) {
  const inputEl = document.getElementById('terminal-input');
  const outputEl = document.getElementById('terminal-output');
  const panelEl = document.getElementById('panel-box');
  
  document.body.classList.remove('correct-flash');
  panelEl.classList.remove('input-success');
  void document.body.offsetWidth;
  
  document.body.classList.add('correct-flash');
  panelEl.classList.add('input-success');
  
  outputEl.innerHTML = msg;
  inputEl.value = '';
  
  customMessageActive = isEgg;
  currentCustomKey = eggKey;

  setTimeout(() => { document.body.classList.remove('correct-flash'); }, 400);
  setTimeout(() => { panelEl.classList.remove('input-success'); }, 1000);
}

function cleanInput(val) {
  let cleaned = val.trim();
  if (cleaned === '!!!!!') return cleaned;
  while (cleaned.endsWith('.') || cleaned.endsWith('?')) {
    cleaned = cleaned.slice(0, -1).trim();
  }
  return cleaned;
}
function processInput() {
  if (isLockout) return;
  const inputEl = document.getElementById('terminal-input');
  let rawVal = inputEl.value;
  
  if (!rawVal.trim()) {
    triggerRedLockout(getDecryptedText('emptyError', currentLang, 'sys'));
    return;
  }
  rawVal = cleanInput(rawVal).toLowerCase();
  if (!rawVal) {
    triggerRedLockout(getDecryptedText('emptyError', currentLang, 'sys'));
    return;
  }
  
  if (rawVal === tgWordRu.toLowerCase() || rawVal === tgWordEn.toLowerCase()) {
    const linkTag = '<a href="' + tgLink + '" target="_blank">' + tgLink + '</a>';
    triggerGreenSuccess(linkTag, true, "tg_link");
    return;
  }
  
  const currentInputHash = getSecureHash(rawVal);
  
  if (eggHashes[currentInputHash]) {
    const targetEggId = eggHashes[currentInputHash];
    triggerGreenSuccess(getDecryptedText(targetEggId, currentLang, 'egg'), true, targetEggId);
    return;
  }
  
  if (currentInputHash === secureStepHashes.mega) {
    triggerGreenSuccess(getDecryptedText('era', currentLang, 'sys'));
    currentStep = 7;
    customMessageActive = false;
    return;
  }

  if (currentInputHash === truePassHash) {
    triggerGreenSuccess(getDecryptedText('era', currentLang, 'sys'));
    currentStep = 7;
    customMessageActive = false;
    return;
  }
  
  customMessageActive = false;
  currentCustomKey = null;
  
  if (currentStep === 0) {
    if (secureStepHashes[0].includes(currentInputHash)) {
      triggerGreenSuccess(getDecryptedText('step0_hint', currentLang, 'sys'));
      currentStep = 1;
    } else { triggerRedLockout(); }
  } 
  else if (currentStep === 1) {
    if (secureStepHashes[1].includes(currentInputHash)) {
      triggerGreenSuccess(getDecryptedText('step1_next', currentLang, 'sys'));
      currentStep = 2;
    } else { triggerRedLockout(); }
  } 
  else if (currentStep === 2) {
    if (secureStepHashes[2].includes(currentInputHash)) {
      triggerGreenSuccess(getDecryptedText('step2_next', currentLang, 'sys'));
      currentStep = 3;
    } else { triggerRedLockout(); }
  }
  else if (currentStep === 3) {
    if (secureStepHashes[3].includes(currentInputHash)) {
      triggerGreenSuccess(getDecryptedText('step3_next', currentLang, 'sys'));
      currentStep = 4;
    } else { triggerRedLockout(); }
  } 
  else if (currentStep === 4) {
    if (secureStepHashes[4].includes(currentInputHash)) {
      triggerGreenSuccess(getDecryptedText('step4_next', currentLang, 'sys'));
      currentStep = 5;
    } else { triggerRedLockout(); }
  } 
  else if (currentStep === 5) {
    if (secureStepHashes[5].includes(currentInputHash)) {
      triggerGreenSuccess(getDecryptedText('step5_next', currentLang, 'sys'));
      currentStep = 6;
    } else { triggerRedLockout(); }
  }
  else { triggerRedLockout(); }
}

document.getElementById('terminal-input').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') processInput();
});

setInterval(updateTimers, 1000);
updateTimers();
window.onload = runBootSequence;
</script>
